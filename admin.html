<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0B0B0A">
<title>LXL Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0B0A;--card:#141311;--card2:#1A1815;--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.12);
  --ink:#F2EDE3;--mute:#A39D90;--dim:#6F6A60;--gold:#C9A24B;--gold-hi:#E6C877;
  --grad:linear-gradient(120deg,#B58E3A,#E6C877 45%,#C9A24B);
  --green:#7FC592;--red:#E88B82;--blue:#82AEE0;--violet:#B7A0E6;
  --display:"Cormorant Garamond",Georgia,serif;--body:"Jost",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:300 15px/1.55 var(--body);-webkit-font-smoothing:antialiased}
h1,h2,h3,p,ul{margin:0}ul{padding:0;list-style:none}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.mute{color:var(--mute)}.dim{color:var(--dim)}.sm{font-size:13px}

/* buttons + fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;min-height:40px;font:500 13.5px/1 var(--body);border:1px solid var(--line2);background:transparent;color:var(--ink);border-radius:10px;transition:.15s}
.btn:hover{border-color:var(--gold);color:var(--gold-hi)}
.btn.gold{background:var(--grad);color:#15120A;border-color:transparent}.btn.gold:hover{filter:brightness(1.08);color:#15120A}
.btn.danger{color:var(--red);border-color:rgba(232,139,130,.35)}.btn.danger:hover{background:rgba(232,139,130,.12);color:var(--red);border-color:var(--red)}
.btn.small{padding:8px 13px;min-height:34px;font-size:13px}
.btn[disabled]{opacity:.5;pointer-events:none}
label{display:block;font:400 12.5px/1.2 var(--body);color:var(--mute);margin-bottom:7px}
input,select,textarea{width:100%;min-width:0;padding:11px 13px;font:300 15px/1.4 var(--body);color:var(--ink);background:var(--card2);border:1px solid var(--line);border-radius:10px;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
select option{background:#1A1815;color:var(--ink)}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold)}
input[type=date]{color-scheme:dark}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.g2 .full{grid-column:1/-1}
@media(max-width:520px){.g2{grid-template-columns:1fr}}

/* login */
.center{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(800px 400px at 50% 0,rgba(201,162,75,.14),transparent 70%),var(--bg)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px}
.login{width:100%;max-width:400px;padding:38px 32px;text-align:center}
.brand b{font:600 32px/1 var(--display);letter-spacing:.14em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{margin-left:10px;font:400 11px/1 var(--body);letter-spacing:.28em;text-transform:uppercase;color:var(--mute)}
.login h1{font:500 30px/1.1 var(--display);margin:26px 0 8px}
.err{color:var(--red);font-size:14px;min-height:1.4em;margin-top:14px}

/* top bar */
.top{position:sticky;top:0;z-index:50;background:rgba(11,11,10,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topin{max-width:1120px;margin:0 auto;padding:0 24px;height:64px;display:flex;align-items:center;gap:28px}
.tabs{display:flex;gap:4px;height:100%;flex:1;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{position:relative;background:none;border:0;padding:0 14px;font:400 14.5px/1 var(--body);color:var(--mute);white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--ink)}
.tabs button.on::after{content:"";position:absolute;left:14px;right:14px;bottom:0;height:2px;background:var(--gold)}
.badge{margin-left:7px;background:var(--gold);color:#15120A;font:500 11px/1 var(--body);padding:3px 7px;border-radius:99px}
.who{display:flex;align-items:center;gap:14px;font-size:13.5px;color:var(--mute);white-space:nowrap}
.who button{background:none;border:0;padding:0;color:var(--mute);text-decoration:underline;font-size:13.5px}
@media(max-width:760px){.topin{padding:0 14px;gap:12px}.who span{display:none}.brand small{display:none}}

/* page */
.page{max-width:1120px;margin:0 auto;padding:34px 24px 90px}
.phead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 24px;margin-bottom:26px}
.phead h1{font:600 40px/1.05 var(--display)}
.phead p{margin-top:6px;color:var(--mute);font-size:14px}
.acts{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.acts select{width:auto;min-width:170px;padding-top:9px;padding-bottom:9px}
.acts input[type=date]{width:150px;padding:9px 11px}
@media(max-width:560px){.page{padding:24px 14px 80px}.phead h1{font-size:32px}.acts{width:100%}.acts select{flex:1}}

/* chips + search */
.tools{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:16px}
.tools input{max-width:300px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:none;border:1px solid var(--line);padding:8px 14px;border-radius:99px;font:400 13.5px/1 var(--body);color:var(--mute)}
.chip:hover{color:var(--ink);border-color:var(--line2)}
.chip.on{background:rgba(201,162,75,.14);border-color:rgba(201,162,75,.5);color:var(--gold-hi)}
.chip em{font-style:normal;margin-left:7px;opacity:.7}

/* rows */
.rows{overflow:hidden}
.rw{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1.3fr) minmax(150px,auto);gap:6px 28px;align-items:center;padding:18px 24px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .15s}
.rw:last-child{border-bottom:0}.rw:hover{background:rgba(255,255,255,.03)}
.rw b{display:block;font-weight:500;font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rw .s{display:block;color:var(--mute);font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rw .c{display:flex;flex-direction:column;align-items:flex-end;gap:7px;text-align:right}
@media(max-width:700px){.rw{grid-template-columns:minmax(0,1fr) auto;padding:16px 16px}.rw .b{grid-column:1/-1;order:3}}
.pill{display:inline-block;padding:4px 11px;border-radius:99px;font:500 12px/1.3 var(--body);white-space:nowrap}
.s-new{background:rgba(230,200,119,.15);color:var(--gold-hi)}.s-contacted{background:rgba(130,174,224,.15);color:var(--blue)}
.s-quoted{background:rgba(183,160,230,.15);color:var(--violet)}.s-won,.s-completed{background:rgba(127,197,146,.15);color:var(--green)}
.s-lost,.s-cancelled{background:rgba(255,255,255,.07);color:var(--dim)}.s-scheduled{background:rgba(130,174,224,.15);color:var(--blue)}
.s-in_progress{background:rgba(230,200,119,.15);color:var(--gold-hi)}.s-admin{background:rgba(230,200,119,.15);color:var(--gold-hi)}.s-receptionist{background:rgba(130,174,224,.15);color:var(--blue)}
.tag{font-size:13px}.tag.due{color:var(--gold-hi)}.tag.ok{color:var(--green)}
.empty{padding:54px 20px;text-align:center;color:var(--mute)}
.empty b{display:block;font:500 22px/1.2 var(--display);color:var(--ink);margin-bottom:6px}
.empty .btn{margin-top:18px}

/* revenue */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:16px}
.kpi{padding:22px}
.kpi .l{font-size:13px;color:var(--mute)}
.kpi .v{font:600 38px/1.1 var(--display);margin-top:8px}
.kpi .d{margin-top:6px;font-size:12.5px;color:var(--dim);min-height:1.2em}
.up{color:var(--green)}.down{color:var(--red)}
@media(max-width:860px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.panel{padding:22px 24px;margin-bottom:16px}
.panel h2{font:600 24px/1.1 var(--display);margin-bottom:4px}
.panel .hd{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.panel .hd p{color:var(--mute);font-size:13.5px}
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:rgba(255,255,255,.07)}.chart .ax{fill:#8A8478;font:11px var(--body)}
.chart rect{fill:#C9A24B}.chart rect:hover{fill:#E6C877}

/* calendar */
.calwrap{display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:20px;align-items:start}
@media(max-width:860px){.calwrap{grid-template-columns:minmax(0,1fr)}}
.cal{padding:18px}
.calnav{display:flex;align-items:center;gap:6px;margin-bottom:12px}
.calnav h2{font:600 24px/1 var(--display);margin-right:auto}
.calnav button{background:none;border:1px solid var(--line);border-radius:8px;height:32px;min-width:32px;padding:0 10px;font-size:13px;color:var(--mute)}
.calnav button:hover{border-color:var(--gold);color:var(--gold-hi)}
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cgrid .dw{text-align:center;font-size:11.5px;color:var(--dim);padding:4px 0}
.cd{height:50px;background:none;border:1px solid transparent;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:14px;color:var(--ink);padding:0}
.cd:hover{background:rgba(255,255,255,.05)}
.cd.out{color:var(--dim);opacity:.5}
.cd.today{border-color:rgba(201,162,75,.5)}
.cd.sel{background:rgba(201,162,75,.18);border-color:var(--gold)}
.dots{display:flex;gap:3px;height:6px}.dots i{width:6px;height:6px;border-radius:50%;background:var(--blue)}
.dots i.in_progress{background:var(--gold)}.dots i.completed{background:var(--green)}
.side h2{font:600 24px/1.1 var(--display)}
.side .hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.side .card{padding:22px 24px;margin-bottom:16px}
.li{display:flex;gap:14px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);cursor:pointer}
.li:last-child{border:0}.li:hover b{color:var(--gold-hi)}
.li b{display:block;font-weight:500}.li .s{display:block;color:var(--mute);font-size:13.5px}.li .end{margin-left:auto;text-align:right;font-size:13px;color:var(--mute);white-space:nowrap}

/* drawer */
.veil{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:80;opacity:0;pointer-events:none;transition:.2s}
.veil.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--card);border-left:1px solid var(--line2);z-index:90;transform:translateX(102%);transition:transform .25s;display:flex;flex-direction:column}
.drawer.open{transform:none}
.drawer header{padding:22px 26px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}
.drawer header h2{font:600 28px/1.1 var(--display)}
.x{background:none;border:1px solid var(--line);border-radius:10px;width:38px;height:38px;font-size:20px;line-height:1;padding:0;color:var(--mute)}
.drawer .body{padding:24px 26px;overflow-y:auto;flex:1}
.drawer footer{padding:16px 26px calc(16px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap}
.drawer footer .sp{margin-left:auto}
.cust{margin-bottom:22px}
.cust h3{font:600 26px/1.15 var(--display);margin:8px 0 4px}
.cust .meta{color:var(--mute);font-size:14px}
.box{margin-top:14px;padding:14px 16px;background:var(--card2);border:1px solid var(--line);border-radius:12px;white-space:pre-wrap;font-size:14.5px;overflow-wrap:anywhere}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 22px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}
.sum div{padding:12px;background:var(--card2);border:1px solid var(--line);border-radius:12px;text-align:center}
.sum small{display:block;font-size:12px;color:var(--mute);margin-bottom:6px}.sum b{font:600 22px/1 var(--display)}
.inl{display:flex;gap:8px}.inl input{flex:1}
.dlg{position:fixed;inset:0;z-index:120;display:grid;place-items:center;background:rgba(0,0,0,.7);padding:20px}
.dlg .card{max-width:400px;width:100%;padding:26px}.dlg p{margin-bottom:22px}.dlg .row{display:flex;gap:10px;justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);z-index:140;background:var(--card2);border:1px solid var(--gold);border-radius:12px;padding:13px 20px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translateX(-50%)}.toast.bad{border-color:var(--red);color:var(--red)}
.note{padding:14px 18px;border:1px solid var(--line);background:rgba(201,162,75,.06);border-radius:12px;font-size:14px;color:var(--mute);margin-bottom:16px}
</style>
</head>
<body>

<div id="login" class="center" hidden>
  <div class="card login">
    <div class="brand"><b>LXL</b><small>Admin</small></div>
    <h1>Welcome back</h1>
    <p class="mute" style="margin-bottom:26px">Sign in with your Google account.</p>
    <button class="btn" id="g-btn" type="button" style="width:100%;background:#fff;color:#1f1f1f;border-color:#fff;min-height:46px">
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      Continue with Google
    </button>
    <p class="err" id="l-err" role="alert"></p>
  </div>
</div>

<div id="denied" class="center" hidden>
  <div class="card login">
    <div class="brand"><b>LXL</b><small>Admin</small></div>
    <h1>No access yet</h1>
    <p class="mute" style="margin-bottom:8px">This Google account has not been given access.</p>
    <p style="margin-bottom:22px">Ask the owner to add <b id="d-email" style="font-weight:500;color:var(--gold-hi);word-break:break-all"></b> under Staff.</p>
    <button class="btn" id="d-out">Sign out</button>
    <p class="dim sm" style="margin-top:22px;word-break:break-all">ID: <span id="d-uid"></span></p>
  </div>
</div>

<div id="app" hidden>
  <header class="top"><div class="topin">
    <div class="brand"><b>LXL</b><small>Admin</small></div>
    <nav class="tabs" id="tabs"></nav>
    <div class="who"><span id="me-name"></span><button id="signout">Sign out</button></div>
  </div></header>
  <main class="page">
    <div class="phead"><div><h1 id="pageTitle"></h1><p id="pageSub"></p></div><div class="acts" id="acts"></div></div>
    <div id="view"></div>
  </main>
</div>

<div class="veil" id="veil"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <header><h2 id="dTitle"></h2><button class="x" id="dClose" aria-label="Close">&times;</button></header>
  <div class="body" id="dBody"></div>
  <footer id="dFoot"></footer>
</aside>
<div class="toast" id="toast" role="status"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signInWithRedirect, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, collection, doc, onSnapshot, addDoc, setDoc, updateDoc, deleteDoc, getDoc, Timestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCkDfCIXCnIiqiME2iM1hleguiKHhOfLG4",
  authDomain: "lxlhome-improvement-llc.firebaseapp.com",
  projectId: "lxlhome-improvement-llc",
  storageBucket: "lxlhome-improvement-llc.firebasestorage.app",
  messagingSenderId: "187111894816",
  appId: "1:187111894816:web:52398864d55c4bf48e7145"
};
const OWNER_UID = "VdQh2hDkOQP5ErDDZk2b7K8o1fJ2"; /* business owner: always full access */
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* ---------- constants ---------- */
const QSTAT = { new:"New", contacted:"Contacted", quoted:"Quoted", won:"Won", lost:"Lost" };
const JSTAT = { scheduled:"Scheduled", in_progress:"In progress", completed:"Completed", cancelled:"Cancelled" };
const Q_SERVICES = ["Kitchen renovation","Bathroom repair or refurbishment","Drywall or painting","Siding, roofing or gutters","General repairs or handyman tasks","Something else"];
const J_SERVICES = ["Kitchen renovation","Bathroom repair or refurbishment","Drywall","Interior painting","Siding","Roofing","Gutters","Home repairs","Fixtures & mounting","Other"];
const RANGES = [["today","Today"],["7d","Last 7 days"],["30d","Last 30 days"],["month","This month"],["lastmonth","Last month"],["3m","Last 3 months"],["6m","Last 6 months"],["12m","Last 12 months"],["ytd","This year"],["all","All time"],["custom","Custom range"]];
const PAGES = {
  requests:{title:"Quote requests",range:true},
  jobs:{title:"Jobs",range:true},
  calendar:{title:"Calendar",range:false},
  revenue:{title:"Revenue",range:true,admin:true},
  staff:{title:"Staff",range:false,admin:true}
};

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const e = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const ymd = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parseYmd = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); };
const sod = d => new Date(d.getFullYear(),d.getMonth(),d.getDate());
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const dayDiff = (a,b) => Math.round((parseYmd(b)-parseYmd(a))/864e5);
const sum = (a,f) => a.reduce((t,x)=>t+(Number(f(x))||0),0);
const money = v => new Intl.NumberFormat("en-US",{style:"currency",currency:"USD",maximumFractionDigits:(Math.abs(v)%1?2:0)}).format(v||0);
const short$ = v => v>=1e6 ? "$"+(v/1e6).toFixed(1)+"M" : v>=1000 ? "$"+(v/1000).toFixed(v%1000?1:0)+"k" : "$"+Math.round(v);
const fmtD = s => s ? parseYmd(s).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}) : "";
const fmtS = d => d.toLocaleDateString("en-US",{month:"short",day:"numeric"});
const num = v => { const n = parseFloat(String(v).replace(/[^0-9.\-]/g,"")); return isFinite(n) ? n : 0; };
const tsOf = v => v && v.toDate ? v.toDate().getTime() : (v ? new Date(v).getTime() : Date.now());
function ago(ts){ const s=(Date.now()-ts)/1000; if(s<60)return"just now"; if(s<3600)return Math.floor(s/60)+" min ago"; if(s<86400)return Math.floor(s/3600)+" hr ago"; const d=Math.floor(s/86400); return d<30?d+(d===1?" day ago":" days ago"):fmtD(ymd(new Date(ts))); }
const pill = (map,k) => `<span class="pill s-${e(k)}">${e(map[k]||k)}</span>`;
function toast(msg,bad){ const t=$("#toast"); t.textContent=msg; t.className="toast show"+(bad?" bad":""); clearTimeout(toast.t); toast.t=setTimeout(()=>t.className="toast",3600); }
function ask(msg,okLabel="Confirm"){ return new Promise(res=>{ const d=document.createElement("div"); d.className="dlg"; d.innerHTML=`<div class="card" role="alertdialog"><p>${e(msg)}</p><div class="row"><button class="btn" data-n>Cancel</button><button class="btn danger" data-y>${e(okLabel)}</button></div></div>`; d.onclick=ev=>{ if(ev.target.matches("[data-y]")){d.remove();res(true);} else if(ev.target.matches("[data-n]")||ev.target===d){d.remove();res(false);} }; document.body.appendChild(d); }); }
function csv(rows,name){ const safe = v => { v = String(v ?? ""); if(/^[=+\-@\t\r]/.test(v)) v="'"+v; return '"'+v.replace(/"/g,'""')+'"'; }; const blob = new Blob([rows.map(r=>r.map(safe).join(",")).join("\n")],{type:"text/csv"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name+"-"+ymd(new Date())+".csv"; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000); }
const waLink = p => { let d=String(p||"").replace(/\D/g,""); if(d.length===10) d="1"+d; return "https://wa.me/"+d; };

/* ---------- state ---------- */
const S = { user:null, staff:null, isAdmin:false, myId:"", page:"requests", range:"30d", cFrom:"", cTo:"",
  quotes:[], jobs:[], staffList:[], qStatus:"all", qSearch:"", jStatus:"all", jSearch:"",
  cal:new Date(), calDay:ymd(new Date()), drawer:null, unsubs:[] };
try { const r = localStorage.getItem("lxl.range"); if (r && RANGES.some(x=>x[0]===r)) S.range = r; } catch(x){}

/* ---------- derived ---------- */
const jobBal = j => (Number(j.price)||0) - (Number(j.paid)||0);
const jobDone = j => j.completedDate || j.endDate || j.startDate;
function earliest(){ const a=[]; S.quotes.forEach(q=>a.push(q._date)); S.jobs.forEach(j=>j.startDate&&a.push(j.startDate)); return a.filter(Boolean).sort()[0]||null; }
function getRange(){
  const today=sod(new Date()), T=ymd(today), y=today.getFullYear(), m=today.getMonth(); let f=null,t=T; const r=S.range;
  if(r==="today") f=T;
  else if(r==="7d") f=ymd(addDays(today,-6));
  else if(r==="30d") f=ymd(addDays(today,-29));
  else if(r==="month") f=ymd(new Date(y,m,1));
  else if(r==="lastmonth"){ f=ymd(new Date(y,m-1,1)); t=ymd(new Date(y,m,0)); }
  else if(r==="3m"||r==="6m"||r==="12m"){ const n=parseInt(r,10), x=new Date(today); x.setDate(1); x.setMonth(x.getMonth()-n); const dim=new Date(x.getFullYear(),x.getMonth()+1,0).getDate(); x.setDate(Math.min(today.getDate(),dim)); f=ymd(addDays(x,1)); }
  else if(r==="ytd") f=y+"-01-01";
  else if(r==="custom"){ f=S.cFrom||T; t=S.cTo||T; if(f>t)[f,t]=[t,f]; }
  const cf=f||earliest()||ymd(addDays(today,-364)); let pf=null,pt=null;
  if(f){ const len=dayDiff(f,t)+1; pt=ymd(addDays(parseYmd(f),-1)); pf=ymd(addDays(parseYmd(pt),-(len-1))); }
  return {f,t,cf,pf,pt,label:f?(f===t?fmtD(f):fmtD(f)+" – "+fmtD(t)):"All time"};
}
function calcRev(f,t){
  const inR=s=>!!s&&(!f||s>=f)&&s<=t;
  const done=S.jobs.filter(j=>j.status==="completed"&&inR(jobDone(j)));
  return {done,revenue:sum(done,j=>j.price),unpaid:sum(done,j=>Math.max(0,jobBal(j)))};
}
function delta(cur,prev){
  if(prev==null) return "";
  if(!prev) return cur?`<span class="up">New</span> vs previous period`:"Same as previous period";
  const p=Math.round((cur-prev)/Math.abs(prev)*100);
  return `<span class="${p>0?"up":p<0?"down":""}">${p>0?"▲":p<0?"▼":"•"} ${Math.abs(p)}%</span> vs previous period`;
}

/* ---------- chart ---------- */
function buckets(f,t){
  const from=parseYmd(f), to=parseYmd(t), days=dayDiff(f,t)+1, out=[];
  if(days<=45){ for(let d=from; d<=to; d=addDays(d,1)) out.push({s:ymd(d),e:ymd(d),label:fmtS(d)}); }
  else if(days<=130){ for(let d=from; d<=to; d=addDays(d,7)){ const en=addDays(d,6); out.push({s:ymd(d),e:ymd(en>to?to:en),label:fmtS(d)}); } }
  else { let c=from; const multi=from.getFullYear()!==to.getFullYear(); while(c<=to){ const eom=new Date(c.getFullYear(),c.getMonth()+1,0); out.push({s:ymd(c),e:ymd(eom>to?to:eom),label:c.toLocaleString("en-US",{month:"short"})+(multi?" "+String(c.getFullYear()).slice(2):"")}); c=new Date(c.getFullYear(),c.getMonth()+1,1); } }
  return out;
}
function niceMax(v){ if(v<=0) return 1; const p=Math.pow(10,Math.floor(Math.log10(v))), n=v/p; return (n<=1?1:n<=2?2:n<=5?5:10)*p; }
function barChart(bk,values){
  const W=760,H=250,pl=52,pr=8,pt=12,pb=30,iw=W-pl-pr,ih=H-pt-pb,n=bk.length;
  const max=niceMax(Math.max(0,...values)), gw=iw/n, bw=Math.max(3,Math.min(36,gw*0.62));
  let g=""; for(let i=0;i<=4;i++){ const y=pt+ih-ih*i/4; g+=`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}"/><text class="ax" x="${pl-8}" y="${y+4}" text-anchor="end">${short$(max*i/4)}</text>`; }
  const step=Math.ceil(n/9);
  bk.forEach((b,i)=>{ const v=values[i], h=ih*v/max, x=pl+gw*i+(gw-bw)/2; if(v>0) g+=`<rect x="${x.toFixed(1)}" y="${(pt+ih-h).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(h,2).toFixed(1)}" rx="3"><title>${e(b.label)}: ${money(v)}</title></rect>`; if(i%step===0) g+=`<text class="ax" x="${pl+gw*i+gw/2}" y="${H-9}" text-anchor="middle">${e(b.label)}</text>`; });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Revenue chart">${g}</svg>`;
}

/* ---------- pages ---------- */
const balTag = j => j.status==="cancelled" ? "" : (Number(j.price)>0 ? (jobBal(j)>0.005 ? `<span class="tag due">${money(jobBal(j))} due</span>` : `<span class="tag ok">Paid</span>`) : "");
const jobDates = j => fmtD(j.startDate)+(j.endDate&&j.endDate!==j.startDate?" – "+fmtD(j.endDate):"");

function pageRequests(){
  const R=getRange(), inR=s=>(!R.f||s>=R.f)&&s<=R.t;
  const inRange=S.quotes.filter(q=>inR(q._date)), term=S.qSearch.trim().toLowerCase();
  const list=inRange.filter(q=>(S.qStatus==="all"||q.status===S.qStatus)&&(!term||[q.name,q.phone,q.email,q.service,q.details].join(" ").toLowerCase().includes(term))).sort((a,b)=>b._ts-a._ts);
  const cnt=k=>k==="all"?inRange.length:inRange.filter(q=>q.status===k).length;
  return `<div class="tools"><input id="qSearch" type="search" placeholder="Search requests" value="${e(S.qSearch)}" data-in="qSearch">
    <div class="chips">${["all",...Object.keys(QSTAT)].map(k=>`<button class="chip ${S.qStatus===k?"on":""}" data-act="qfilter" data-k="${k}">${k==="all"?"All":QSTAT[k]}<em>${cnt(k)}</em></button>`).join("")}</div></div>
  <div class="card rows">${list.map(q=>`<div class="rw" data-act="quote" data-id="${e(q.id)}">
    <div class="a"><b>${e(q.name)}</b><span class="s">${e(q.phone)}</span></div>
    <div class="b"><b>${e(q.service||"Request")}</b><span class="s">${e((q.details||"").slice(0,90))}</span></div>
    <div class="c">${pill(QSTAT,q.status)}<span class="s sm mute">${q.quotedAmount?money(q.quotedAmount)+" · ":""}${ago(q._ts)}</span></div></div>`).join("")||`<div class="empty"><b>No requests here</b>${S.qSearch||S.qStatus!=="all"?"Try a different filter or search.":"New website requests will appear here automatically."}</div>`}</div>`;
}

function pageJobs(){
  const R=getRange(), inR=s=>!!s&&(!R.f||s>=R.f)&&s<=R.t;
  const inRange=S.jobs.filter(j=>inR(j.startDate)), term=S.jSearch.trim().toLowerCase();
  const list=inRange.filter(j=>(S.jStatus==="all"||j.status===S.jStatus)&&(!term||[j.title,j.clientName,j.address,j.service,j.phone].join(" ").toLowerCase().includes(term))).sort((a,b)=>b.startDate.localeCompare(a.startDate));
  const cnt=k=>k==="all"?inRange.length:inRange.filter(j=>j.status===k).length;
  return `<div class="tools"><input id="jSearch" type="search" placeholder="Search jobs" value="${e(S.jSearch)}" data-in="jSearch">
    <div class="chips">${["all",...Object.keys(JSTAT)].map(k=>`<button class="chip ${S.jStatus===k?"on":""}" data-act="jfilter" data-k="${k}">${k==="all"?"All":JSTAT[k]}<em>${cnt(k)}</em></button>`).join("")}</div></div>
  <div class="card rows">${list.map(j=>`<div class="rw" data-act="job" data-id="${e(j.id)}">
    <div class="a"><b>${e(j.title)}</b><span class="s">${e(j.clientName)}${j.address?" · "+e(j.address):""}</span></div>
    <div class="b"><b>${jobDates(j)}</b><span class="s">${e(j.service)}</span></div>
    <div class="c">${pill(JSTAT,j.status)}<span class="s sm"><span class="mute">${money(j.price)}</span> ${balTag(j)}</span></div></div>`).join("")||`<div class="empty"><b>No jobs here</b>${S.jSearch||S.jStatus!=="all"?"Try a different filter or search.":"Add a job to start tracking work, dates and payments."}<br><button class="btn gold" data-act="new-job">+ New job</button></div>`}</div>`;
}

function pageCalendar(){
  const y=S.cal.getFullYear(), m=S.cal.getMonth(), first=new Date(y,m,1), dim=new Date(y,m+1,0).getDate(), weeks=Math.ceil((first.getDay()+dim)/7), start=addDays(first,-first.getDay()), T=ymd(new Date());
  const jobs=S.jobs.filter(j=>j.status!=="cancelled"&&j.startDate);
  const onDay=s=>jobs.filter(j=>j.startDate<=s&&(j.endDate||j.startDate)>=s);
  let cells=["S","M","T","W","T","F","S"].map(d=>`<div class="dw">${d}</div>`).join("");
  for(let i=0;i<weeks*7;i++){ const d=addDays(start,i), s=ymd(d), js=onDay(s);
    cells+=`<button class="cd ${d.getMonth()!==m?"out":""} ${s===T?"today":""} ${s===S.calDay?"sel":""}" data-act="calday" data-d="${s}"><span>${d.getDate()}</span><span class="dots">${js.slice(0,3).map(j=>`<i class="${e(j.status)}"></i>`).join("")}</span></button>`; }
  const sel=S.calDay?onDay(S.calDay):[];
  const up=jobs.filter(j=>["scheduled","in_progress"].includes(j.status)&&(j.endDate||j.startDate)>=T).sort((a,b)=>a.startDate.localeCompare(b.startDate)).slice(0,6);
  const li=j=>`<div class="li" data-act="job" data-id="${e(j.id)}"><div><b>${e(j.title)}</b><span class="s">${e(j.clientName)}${j.address?" · "+e(j.address):""}</span></div><div class="end">${pill(JSTAT,j.status)}</div></div>`;
  return `<div class="calwrap"><div class="card cal"><div class="calnav"><h2>${S.cal.toLocaleString("en-US",{month:"long",year:"numeric"})}</h2><button data-act="calprev" aria-label="Previous month">&lsaquo;</button><button data-act="caltoday">Today</button><button data-act="calnext" aria-label="Next month">&rsaquo;</button></div><div class="cgrid">${cells}</div></div>
  <div class="side"><div class="card"><div class="hd"><h2>${S.calDay?fmtD(S.calDay):"Select a day"}</h2><button class="btn small" data-act="new-job" data-date="${e(S.calDay||"")}">+ Add job</button></div>
    ${sel.length?sel.map(li).join(""):`<p class="mute" style="padding:10px 0 4px">Nothing scheduled for this day.</p>`}</div>
  <div class="card"><div class="hd"><h2>Coming up</h2></div>${up.length?up.map(j=>`<div class="li" data-act="job" data-id="${e(j.id)}"><div><b>${e(j.title)}</b><span class="s">${e(j.clientName)}</span></div><div class="end">${fmtD(j.startDate)}</div></div>`).join(""):`<p class="mute" style="padding:10px 0 4px">No upcoming jobs.</p>`}</div></div></div>`;
}

function pageRevenue(){
  const R=getRange(), c=calcRev(R.f,R.t), p=R.f?calcRev(R.pf,R.pt):null, bk=buckets(R.cf,R.t);
  const vals=bk.map(b=>sum(c.done.filter(j=>jobDone(j)>=b.s&&jobDone(j)<=b.e),j=>j.price));
  const list=[...c.done].sort((a,b)=>jobDone(b).localeCompare(jobDone(a)));
  const kpi=(l,v,d)=>`<div class="card kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="d">${d||""}</div></div>`;
  return `<div class="note">Revenue is the price of jobs marked <b style="color:var(--gold-hi);font-weight:400">Completed</b>, counted on the date they were completed.</div>
  <div class="kpis">${kpi("Revenue",money(c.revenue),p?delta(c.revenue,p.revenue):"")}${kpi("Jobs completed",c.done.length,p?delta(c.done.length,p.done.length):"")}${kpi("Average job",c.done.length?money(c.revenue/c.done.length):"–","")}${kpi("Still unpaid",money(c.unpaid),"On these completed jobs")}</div>
  <div class="card panel"><div class="hd"><div><h2>Revenue over time</h2><p>${e(R.label)}</p></div></div>${barChart(bk,vals)}</div>
  <div class="card panel" style="padding:22px 0 0;overflow:hidden"><div class="hd" style="padding:0 24px"><div><h2>Completed jobs</h2><p>${list.length} in this period</p></div></div>
    ${list.length?`<div class="rows" style="border-top:1px solid var(--line)">${list.map(j=>`<div class="rw" data-act="job" data-id="${e(j.id)}"><div class="a"><b>${e(j.title)}</b><span class="s">${e(j.clientName)}</span></div><div class="b"><b>${fmtD(jobDone(j))}</b><span class="s">${e(j.service)}</span></div><div class="c"><b style="font-size:16px">${money(j.price)}</b>${balTag(j)}</div></div>`).join("")}</div>`:`<div class="empty" style="border-top:1px solid var(--line)"><b>No completed jobs</b>Mark a job as Completed and it will count here.</div>`}</div>`;
}

function pageStaff(){
  return `<div class="note">Admins see everything. Receptionists can manage requests, jobs and the calendar, but cannot see Revenue or Staff and cannot delete anything. The owner always has full access.</div>
  <div class="card rows">${S.staffList.map(s=>`<div class="rw" data-act="staff" data-id="${e(s.id)}" style="grid-template-columns:minmax(0,1.3fr) minmax(0,1.3fr) auto"><div class="a"><b>${e(s.name||"")}</b><span class="s">${e(s.email||s.id)}</span></div><div class="b">${s.active===false?'<span class="dim">Access off</span>':'<span class="up">Active</span>'}</div><div class="c">${pill({admin:"Admin",receptionist:"Receptionist"},s.role)}</div></div>`).join("")||`<div class="empty"><b>No other staff yet</b>Add your receptionist with their Google email.<br><button class="btn gold" data-act="new-staff">+ Add staff</button></div>`}</div>`;
}

/* ---------- render ---------- */
function render(){
  if(!S.staff) return;
  const pg=PAGES[S.page], R=getRange();
  const a=document.activeElement, aid=a&&a.id, pos=a&&a.selectionStart, sy=window.scrollY;
  const newCount=S.quotes.filter(q=>q.status==="new").length;
  $("#tabs").innerHTML=Object.entries(PAGES).filter(([k,v])=>!v.admin||S.isAdmin).map(([k,v])=>`<button data-page="${k}" class="${S.page===k?"on":""}">${k==="requests"?"Requests":v.title}${k==="requests"&&newCount?`<span class="badge">${newCount}</span>`:""}</button>`).join("");
  $("#pageTitle").textContent=pg.title;
  $("#pageSub").textContent=pg.range?"Showing "+R.label:"";
  const primary={requests:["new-quote","+ New request"],jobs:["new-job","+ New job"],calendar:["new-job","+ New job"],staff:["new-staff","+ Add staff"]}[S.page];
  const exp={requests:"export-quotes",jobs:"export-jobs",revenue:"export-revenue"}[S.page];
  $("#acts").innerHTML=(pg.range?`<select id="rangeSel" aria-label="Date range">${RANGES.map(r=>`<option value="${r[0]}" ${S.range===r[0]?"selected":""}>${r[1]}</option>`).join("")}</select>${S.range==="custom"?`<input type="date" id="cFrom" value="${e(S.cFrom)}" aria-label="From"><input type="date" id="cTo" value="${e(S.cTo)}" aria-label="To">`:""}`:"")
    +(exp?`<button class="btn" data-act="${exp}">Export</button>`:"")+(primary?`<button class="btn gold" data-act="${primary[0]}">${primary[1]}</button>`:"");
  $("#view").innerHTML={requests:pageRequests,jobs:pageJobs,calendar:pageCalendar,revenue:pageRevenue,staff:pageStaff}[S.page]();
  document.title=(newCount?`(${newCount}) `:"")+"LXL Admin";
  if(aid){ const el=document.getElementById(aid); if(el){ el.focus(); try{ el.setSelectionRange(pos,pos); }catch(x){} } }
  window.scrollTo(0,sy);
}
function go(p){ if(PAGES[p].admin&&!S.isAdmin) p="requests"; S.page=p; render(); window.scrollTo(0,0); }

/* ---------- drawer ---------- */
function openDrawer(title,body,foot){ $("#dTitle").textContent=title; $("#dBody").innerHTML=body; $("#dFoot").innerHTML=foot; $("#drawer").classList.add("open"); $("#veil").classList.add("open"); $("#drawer").setAttribute("aria-hidden","false"); $("#dBody").scrollTop=0; }
function closeDrawer(){ $("#drawer").classList.remove("open"); $("#veil").classList.remove("open"); $("#drawer").setAttribute("aria-hidden","true"); S.drawer=null; }
const val = id => { const el=document.getElementById(id); return el?el.value.trim():""; };
const opts = (list,cur) => { const l=list.includes(cur)||!cur?list:[...list,cur]; return l.map(o=>`<option ${o===cur?"selected":""}>${e(o)}</option>`).join(""); };
const kopts = (map,cur) => Object.entries(map).map(([k,v])=>`<option value="${k}" ${k===cur?"selected":""}>${v}</option>`).join("");
async function guard(btn,fn){ btn&&(btn.disabled=true); try{ await fn(); }catch(err){ console.error(err); toast(err.code==="permission-denied"?"Not allowed for your role.":"Something went wrong: "+(err.message||err),true); } finally{ btn&&(btn.disabled=false); } }

function openQuote(id){
  const q=S.quotes.find(x=>x.id===id); if(!q) return;
  S.drawer={type:"quote",id};
  openDrawer("Request",`
    <div class="cust"><span class="pill s-${e(q.status)}">${e(QSTAT[q.status])}</span><h3>${e(q.name)}</h3>
      <div class="meta">${e(q.phone)}${q.email?" · "+e(q.email):""}</div>
      <div class="meta">${e(q.service)} · received ${fmtD(q._date)}${q.source==="manual"?" (added by staff)":""}</div>
      ${q.details?`<div class="box">${e(q.details)}</div>`:""}</div>
    <div class="quick">${q.phone?`<a class="btn small" href="tel:${e(q.phone)}">Call</a><a class="btn small" href="${e(waLink(q.phone))}" target="_blank" rel="noopener">WhatsApp</a>`:""}${q.email?`<a class="btn small" href="mailto:${e(q.email)}">Email</a>`:""}</div>
    <div class="g2"><div><label for="dq-status">Status</label><select id="dq-status">${kopts(QSTAT,q.status)}</select></div>
      <div><label for="dq-amount">Quoted amount ($)</label><input id="dq-amount" inputmode="decimal" value="${q.quotedAmount||""}"></div>
      <div class="full"><label for="dq-notes">Notes</label><textarea id="dq-notes" placeholder="Call notes, site visit, what was agreed...">${e(q.notes||"")}</textarea></div></div>`,
    `<button class="btn gold" data-act="save-quote">Save</button><button class="btn" data-act="quote-to-job">Create job</button>${S.isAdmin?`<button class="btn danger sp" data-act="del-quote">Delete</button>`:""}`);
}
function newQuoteDrawer(){
  S.drawer={type:"quote-new"};
  openDrawer("New request",`<p class="mute" style="margin-bottom:18px">For calls, texts and walk-ins that did not come through the website.</p><div class="g2">
    <div><label for="dq-name">Name</label><input id="dq-name"></div><div><label for="dq-phone">Phone</label><input id="dq-phone" type="tel"></div>
    <div class="full"><label for="dq-email">Email (optional)</label><input id="dq-email" type="email"></div>
    <div class="full"><label for="dq-service">Service</label><select id="dq-service">${opts(Q_SERVICES,"")}</select></div>
    <div class="full"><label for="dq-details">Job details</label><textarea id="dq-details"></textarea></div></div>`,
    `<button class="btn gold" data-act="create-quote">Add request</button>`);
}

  const j=id?S.jobs.find(x=>x.id===id):null; if(id&&!j) return;
  const d=j?{...j}:Object.assign({title:"",clientName:"",phone:"",address:"",service:"Other",status:"scheduled",startDate:ymd(new Date()),endDate:"",completedDate:"",price:0,paid:0,notes:""},pre||{});
  S.drawer={type:"job",id:id||null,quoteId:d.quoteId||null};
  openDrawer(id?"Job":"New job",`
    <div class="g2">
      <div class="full"><label for="dj-title">Job</label><input id="dj-title" value="${e(d.title)}" placeholder="e.g. Master bathroom refurbishment"></div>
      <div><label for="dj-client">Client</label><input id="dj-client" value="${e(d.clientName)}"></div>
      <div><label for="dj-phone">Phone</label><input id="dj-phone" type="tel" value="${e(d.phone||"")}"></div>
      <div class="full"><label for="dj-addr">Address</label><input id="dj-addr" value="${e(d.address||"")}"></div>
      <div><label for="dj-service">Service</label><select id="dj-service">${opts(J_SERVICES,d.service)}</select></div>
      <div><label for="dj-status">Status</label><select id="dj-status">${kopts(JSTAT,d.status)}</select></div>
      <div><label for="dj-start">Start date</label><input id="dj-start" type="date" value="${e(d.startDate)}"></div>
      <div><label for="dj-end">End date</label><input id="dj-end" type="date" value="${e(d.endDate||"")}"></div>
      <div id="dj-compwrap" class="full" ${d.status==="completed"?"":"hidden"}><label for="dj-comp">Completed on</label><input id="dj-comp" type="date" value="${e(d.completedDate||"")}"></div>
      <div><label for="dj-price">Price ($)</label><input id="dj-price" inputmode="decimal" value="${d.price||""}"></div>
      <div><label for="dj-paid">Paid so far ($)</label><div class="inl"><input id="dj-paid" inputmode="decimal" value="${d.paid||""}"><button class="btn small" type="button" data-act="paid-full">Paid in full</button></div></div>
      <div class="full"><label for="dj-notes">Notes</label><textarea id="dj-notes" placeholder="Scope of work, materials, access instructions...">${e(d.notes||"")}</textarea></div>
    </div><div class="sum" id="jobSum"></div>`,
    `<button class="btn gold" data-act="save-job">Save job</button>${S.isAdmin&&id?`<button class="btn danger sp" data-act="del-job">Delete</button>`:""}`);
  refreshJob();
}
function refreshJob(){ const price=num(val("dj-price")), paid=num(val("dj-paid")), bal=price-paid; const el=$("#jobSum"); if(el) el.innerHTML=`<div><small>Price</small><b>${money(price)}</b></div><div><small>Paid</small><b>${money(paid)}</b></div><div><small>Balance</small><b style="color:${bal>0.005?"var(--gold-hi)":"var(--green)"}">${money(bal)}</b></div>`; }

function openStaff(id){
  const s=id?S.staffList.find(z=>z.id===id):null; if(id&&!s) return;
  S.drawer={type:"staff",id:id||null}; const self=id&&id===S.myId;
  openDrawer(id?"Staff member":"Add staff",`
    ${id?"":`<p class="mute" style="margin-bottom:18px">Enter the Google (Gmail) address they will sign in with. They can sign in right away.</p>`}
    <div class="g2"><div class="full"><label for="ds-name">Name</label><input id="ds-name" value="${e(s?s.name:"")}"></div>
      <div class="full"><label for="ds-email">Google email</label><input id="ds-email" type="email" value="${e(s?s.email||s.id:"")}" ${id?"disabled":""}></div>
      <div><label for="ds-role">Role</label><select id="ds-role" ${self?"disabled":""}><option value="receptionist" ${!s||s.role==="receptionist"?"selected":""}>Receptionist</option><option value="admin" ${s&&s.role==="admin"?"selected":""}>Admin</option></select></div>
      ${id?`<div><label for="ds-active">Access</label><select id="ds-active" ${self?"disabled":""}><option value="1" ${s.active!==false?"selected":""}>Active</option><option value="0" ${s.active===false?"selected":""}>Turned off</option></select></div>`:""}</div>`,
    `<button class="btn gold" data-act="save-staff">${id?"Save":"Add staff"}</button>${id&&!self?`<button class="btn danger sp" data-act="del-staff">Remove</button>`:""}`);
}

/* ---------- actions ---------- */
const A = {
  quote:t=>openQuote(t.dataset.id), job:t=>openJob(t.dataset.id), staff:t=>openStaff(t.dataset.id),
  "new-quote":()=>newQuoteDrawer(), "new-job":t=>openJob(null,t&&t.dataset.date?{startDate:t.dataset.date}:null), "new-staff":()=>openStaff(null),
  qfilter:t=>{S.qStatus=t.dataset.k;render();}, jfilter:t=>{S.jStatus=t.dataset.k;render();},
  calprev:()=>{S.cal=new Date(S.cal.getFullYear(),S.cal.getMonth()-1,1);render();},
  calnext:()=>{S.cal=new Date(S.cal.getFullYear(),S.cal.getMonth()+1,1);render();},
  caltoday:()=>{S.cal=new Date();S.calDay=ymd(new Date());render();},
  calday:t=>{S.calDay=t.dataset.d;render();},

  "create-quote":t=>guard(t,async()=>{
    const d={name:val("dq-name"),phone:val("dq-phone"),email:val("dq-email"),service:val("dq-service"),details:val("dq-details")};
    if(!d.name||!d.phone){toast("Name and phone are required.",true);return;}
    await addDoc(collection(db,"quoteRequests"),{...d,source:"manual",status:"new",createdAt:Timestamp.now(),createdBy:S.user.email});
    closeDrawer(); toast("Request added.");
  }),
  "save-quote":t=>guard(t,async()=>{
    await updateDoc(doc(db,"quoteRequests",S.drawer.id),{status:val("dq-status"),quotedAmount:num(val("dq-amount"))||null,notes:val("dq-notes"),updatedAt:Timestamp.now(),updatedBy:S.user.email});
    closeDrawer(); toast("Saved.");
  }),
  "quote-to-job":()=>{
    const q=S.quotes.find(x=>x.id===S.drawer.id); if(!q) return;
    const map={"Drywall or painting":"Drywall","Siding, roofing or gutters":"Siding","General repairs or handyman tasks":"Home repairs","Something else":"Other"};
    const pre={title:q.service,clientName:q.name,phone:q.phone,service:map[q.service]||q.service,price:num(val("dq-amount"))||q.quotedAmount||0,notes:q.details||"",quoteId:q.id};
    closeDrawer(); openJob(null,pre);
  },
  "del-quote":async t=>{ if(await ask("Delete this request permanently?","Delete")) guard(t,async()=>{ await deleteDoc(doc(db,"quoteRequests",S.drawer.id)); closeDrawer(); toast("Deleted."); }); },

  "paid-full":()=>{ $("#dj-paid").value=num(val("dj-price"))||""; refreshJob(); },
  "save-job":t=>guard(t,async()=>{
    const status=val("dj-status"), start=val("dj-start"), end=val("dj-end");
    const d={title:val("dj-title"),clientName:val("dj-client"),phone:val("dj-phone"),address:val("dj-addr"),service:val("dj-service"),status,startDate:start,endDate:end,price:num(val("dj-price")),paid:num(val("dj-paid")),notes:val("dj-notes"),updatedAt:Timestamp.now(),updatedBy:S.user.email};
    d.completedDate=status==="completed"?(val("dj-comp")||ymd(new Date())):"";
    if(!d.title||!d.clientName||!start){toast("Job, client and start date are required.",true);return;}
    if(end&&end<start){toast("The end date is before the start date.",true);return;}
    const id=S.drawer.id, qid=S.drawer.quoteId;
    if(id) await updateDoc(doc(db,"jobs",id),d);
    else{ if(qid) d.quoteId=qid; d.createdAt=Timestamp.now(); d.createdBy=S.user.email; const ref=await addDoc(collection(db,"jobs"),d); if(qid) await updateDoc(doc(db,"quoteRequests",qid),{status:"won",jobId:ref.id,updatedAt:Timestamp.now()}); }
    closeDrawer(); toast("Job saved.");
  }),
  "del-job":async t=>{ if(await ask("Delete this job permanently?","Delete")) guard(t,async()=>{ await deleteDoc(doc(db,"jobs",S.drawer.id)); closeDrawer(); toast("Deleted."); }); },

  "save-staff":t=>guard(t,async()=>{
    const id=S.drawer.id, name=val("ds-name"), role=val("ds-role");
    if(!name){toast("Name is required.",true);return;}
    if(id){ const self=id===S.myId; await updateDoc(doc(db,"staff",id),self?{name}:{name,role,active:val("ds-active")!=="0"}); closeDrawer(); toast("Saved."); return; }
    const email=val("ds-email").toLowerCase();
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){toast("Enter a valid Google email address.",true);return;}
    if(S.staffList.some(x=>x.id===email)){toast("That person is already on the list.",true);return;}
    await setDoc(doc(db,"staff",email),{name,email,role,active:true,createdAt:Timestamp.now()});
    closeDrawer(); toast("Added. They can sign in with Google now.");
  }),
  "del-staff":async t=>{ if(await ask("Remove this person's access? They will no longer be able to open the dashboard.","Remove")) guard(t,async()=>{ await deleteDoc(doc(db,"staff",S.drawer.id)); closeDrawer(); toast("Access removed."); }); },

  "export-quotes":()=>{ const R=getRange(); csv([["Received","Name","Phone","Email","Service","Status","Quoted","Details","Notes"],...S.quotes.filter(q=>(!R.f||q._date>=R.f)&&q._date<=R.t).map(q=>[q._date,q.name,q.phone,q.email,q.service,q.status,q.quotedAmount||"",q.details,q.notes||""])],"requests"); },
  "export-jobs":()=>{ const R=getRange(); csv([["Start","End","Job","Client","Phone","Address","Service","Status","Price","Paid","Balance"],...S.jobs.filter(j=>(!R.f||j.startDate>=R.f)&&j.startDate<=R.t).map(j=>[j.startDate,j.endDate||"",j.title,j.clientName,j.phone,j.address||"",j.service,j.status,j.price||0,j.paid||0,jobBal(j)])],"jobs"); },
  "export-revenue":()=>{ const R=getRange(), c=calcRev(R.f,R.t); csv([["Completed","Job","Client","Service","Price","Paid","Balance"],...c.done.map(j=>[jobDone(j),j.title,j.clientName,j.service,j.price||0,j.paid||0,jobBal(j)])],"revenue"); }
};

/* ---------- events ---------- */
document.addEventListener("click",ev=>{
  const nb=ev.target.closest("[data-page]"); if(nb){ go(nb.dataset.page); return; }
  const t=ev.target.closest("[data-act]");
  if(t&&A[t.dataset.act]){ ev.stopPropagation(); A[t.dataset.act](t); }
});
document.addEventListener("input",ev=>{
  const t=ev.target;
  if(t.dataset&&t.dataset.in){ S[t.dataset.in]=t.value; render(); }
  if(t.id==="dj-price"||t.id==="dj-paid") refreshJob();
});
document.addEventListener("change",ev=>{
  const t=ev.target;
  if(t.id==="rangeSel"){ S.range=t.value; try{ localStorage.setItem("lxl.range",S.range); }catch(x){} render(); }
  if(t.id==="cFrom"){ S.cFrom=t.value; render(); }
  if(t.id==="cTo"){ S.cTo=t.value; render(); }
  if(t.id==="dj-status") $("#dj-compwrap").hidden=t.value!=="completed";
});
$("#dClose").onclick=closeDrawer; $("#veil").onclick=closeDrawer;
document.addEventListener("keydown",ev=>{ if(ev.key==="Escape") closeDrawer(); });
$("#signout").onclick=()=>signOut(auth); $("#d-out").onclick=()=>signOut(auth);

/* ---------- auth ---------- */
const show=id=>["login","denied","app"].forEach(x=>$("#"+x).hidden=x!==id);
const provider=new GoogleAuthProvider(); provider.setCustomParameters({prompt:"select_account"});
$("#g-btn").onclick=async()=>{
  const er=$("#l-err"), b=$("#g-btn"); er.textContent=""; b.disabled=true;
  try{ await signInWithPopup(auth,provider); }
  catch(err){
    if(err.code==="auth/popup-blocked"){ try{ await signInWithRedirect(auth,provider); return; }catch(x){} }
    er.textContent=(err.code==="auth/popup-closed-by-user"||err.code==="auth/cancelled-popup-request")?"":
      err.code==="auth/unauthorized-domain"?"This website address is not authorised in Firebase (Authentication > Settings > Authorized domains).":
      err.code==="auth/operation-not-allowed"?"Google sign-in is not turned on in Firebase Authentication yet.":
      "Could not sign in with Google. Please try again.";
  }
  b.disabled=false;
};
function stopListeners(){ S.unsubs.forEach(u=>u()); S.unsubs=[]; S.quotes=[]; S.jobs=[]; S.staffList=[]; }
function listen(name,key,map){
  S.unsubs.push(onSnapshot(collection(db,name),snap=>{ S[key]=snap.docs.map(d=>map(d.id,d.data())); render(); },err=>{ console.error(name,err); toast("Cannot load "+name+": "+(err.code==="permission-denied"?"permission denied (check Firestore rules).":err.message),true); }));
}
onAuthStateChanged(auth,async user=>{
  stopListeners(); S.user=user; S.staff=null; S.isAdmin=false; closeDrawer();
  if(!user){ show("login"); return; }
  S.myId=(user.email||"").toLowerCase();
  if(user.uid===OWNER_UID){ S.staff={name:user.displayName||"Owner",role:"admin"}; }
  else{
    let snap=null; try{ if(S.myId) snap=await getDoc(doc(db,"staff",S.myId)); }catch(err){}
    if(!snap||!snap.exists()||snap.data().active===false){ $("#d-email").textContent=user.email||"(no email)"; $("#d-uid").textContent=user.uid; show("denied"); return; }
    S.staff=snap.data();
  }
  S.isAdmin=S.staff.role==="admin";
  $("#me-name").textContent=S.staff.name||user.email;
  show("app");
  listen("quoteRequests","quotes",(id,d)=>{ const ts=tsOf(d.createdAt); return {id,...d,name:d.name||"",phone:d.phone||"",email:d.email||"",service:d.service||"",details:d.details||"",status:QSTAT[d.status]?d.status:"new",_ts:ts,_date:ymd(new Date(ts))}; });
  listen("jobs","jobs",(id,d)=>({id,...d,title:d.title||"",clientName:d.clientName||"",service:d.service||"Other",status:JSTAT[d.status]?d.status:"scheduled",startDate:d.startDate||"",price:Number(d.price)||0,paid:Number(d.paid)||0}));
  if(S.isAdmin) listen("staff","staffList",(id,d)=>({id,...d}));
  if(!PAGES[S.page]||(PAGES[S.page].admin&&!S.isAdmin)) S.page="requests";
  render();
});
</script>
</body>
