<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0A0A0A">
<title>LXL Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --black:#0A0A0A;--coal:#111;--graphite:#181715;--panel:#1D1B18;--ivory:#F2EDE3;--mute:#A9A296;--dim:#7C766B;
  --gold:#C9A24B;--gold-hi:#E6C877;--gold-lo:#8F6F2A;--hair:rgba(201,162,75,.22);--hair2:rgba(242,237,227,.08);
  --gold-grad:linear-gradient(120deg,#8F6F2A 0%,#E6C877 38%,#C9A24B 62%,#8F6F2A 100%);
  --green:#7FBF8E;--red:#E58F86;--blue:#7FA8D9;--violet:#B29AE0;
  --display:"Cormorant Garamond",Georgia,serif;--body:"Jost",system-ui,-apple-system,"Segoe UI",sans-serif;--side:248px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--black);color:var(--ivory);font:300 15px/1.55 var(--body);-webkit-font-smoothing:antialiased}
h1,h2,h3,p,ul{margin:0}ul{padding:0;list-style:none}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.mute{color:var(--mute)}.dim{color:var(--dim)}.r{text-align:right}.nw{white-space:nowrap}

/* buttons & fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;min-height:40px;font:500 11px/1 var(--body);letter-spacing:.2em;text-transform:uppercase;border:1px solid var(--gold);background:transparent;color:var(--ivory);border-radius:0;transition:.2s}
.btn:hover{background:var(--gold);color:var(--black)}
.btn.gold{background:var(--gold-grad);color:var(--black)}.btn.gold:hover{background:var(--gold-hi)}
.btn.sm{padding:8px 12px;min-height:32px;font-size:10px}
.btn.danger{border-color:rgba(229,143,134,.6);color:var(--red)}.btn.danger:hover{background:var(--red);color:var(--black)}
.btn[disabled]{opacity:.5;pointer-events:none}
label{display:block;font:400 10.5px/1.2 var(--body);letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
input,select,textarea{width:100%;min-width:0;padding:11px 12px;font:300 15px/1.4 var(--body);color:var(--ivory);background:rgba(255,255,255,.03);border:1px solid var(--hair2);border-bottom:1px solid rgba(201,162,75,.4);border-radius:0;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--gold) 50%),linear-gradient(135deg,var(--gold) 50%,transparent 50%);background-position:calc(100% - 16px) 52%,calc(100% - 10px) 52%;background-size:6px 6px;background-repeat:no-repeat;padding-right:32px}
select option{background:#181715;color:var(--ivory)}
textarea{min-height:96px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold)}
input[type=date]{color-scheme:dark}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid2 .full{grid-column:1/-1}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}

/* login */
.center{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(700px 420px at 50% 0,rgba(201,162,75,.16),transparent 70%),var(--black)}
.card{background:var(--graphite);border:1px solid var(--hair)}
.login{width:100%;max-width:420px;padding:40px 34px}
.logo b{font:500 34px/1 var(--display);letter-spacing:.14em;background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo small{display:block;margin-top:6px;font:400 10px/1 var(--body);letter-spacing:.34em;text-transform:uppercase;color:var(--mute)}
.login h1{font:400 30px/1.1 var(--display);margin:26px 0 22px}
.login .f{margin-bottom:16px}
.err{color:var(--red);font-size:14px;min-height:1.4em;margin-top:12px}
.linkbtn{background:none;border:0;color:var(--mute);font-size:13px;text-decoration:underline;padding:0;margin-top:16px}

/* app shell */
.side{position:fixed;inset:0 auto 0 0;width:var(--side);background:var(--coal);border-right:1px solid var(--hair);display:flex;flex-direction:column;padding:22px 14px;z-index:70;transition:transform .25s}
.side .logo{padding:4px 10px 24px}
.nav{display:grid;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;padding:12px 12px;background:none;border:0;border-left:2px solid transparent;text-align:left;font:400 12px/1 var(--body);letter-spacing:.18em;text-transform:uppercase;color:var(--mute)}
.nav button:hover{color:var(--ivory);background:rgba(255,255,255,.03)}
.nav button.on{color:var(--gold-hi);border-left-color:var(--gold);background:rgba(201,162,75,.08)}
.nav svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
.badge{margin-left:auto;background:var(--gold);color:var(--black);font:500 10px/1 var(--body);padding:4px 7px;border-radius:99px;letter-spacing:0}
.me{margin-top:auto;padding:16px 10px 4px;border-top:1px solid var(--hair);font-size:13px}
.me b{display:block;font-weight:400;color:var(--ivory);overflow:hidden;text-overflow:ellipsis}
.me span{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.me button{margin-top:10px;background:none;border:0;color:var(--mute);font-size:13px;text-decoration:underline;padding:0}
.main{margin-left:var(--side);min-height:100vh}
.top{position:sticky;top:0;z-index:50;background:rgba(10,10,10,.96);border-bottom:1px solid var(--hair);padding:14px 28px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px}
.top h1{font:400 30px/1 var(--display);margin-right:auto}
.burger{display:none;background:none;border:1px solid var(--hair);width:40px;height:40px;padding:0}
.ranges{display:flex;flex-wrap:wrap;gap:4px}
.ranges button{background:none;border:1px solid var(--hair2);padding:8px 11px;font:400 11px/1 var(--body);letter-spacing:.08em;color:var(--mute)}
.ranges button:hover{color:var(--ivory);border-color:var(--hair)}
.ranges button.on{background:var(--gold);border-color:var(--gold);color:var(--black);font-weight:500}
.custom{display:flex;gap:8px;align-items:center;width:100%;justify-content:flex-end}
.custom input{width:150px;padding:8px 10px}
.content{padding:26px 28px 70px;max-width:1500px}
.sub{color:var(--mute);margin-bottom:22px;font-size:14px}
@media(max-width:980px){
  .side{transform:translateX(-100%)}.side.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.6)}
  .main{margin-left:0}.burger{display:grid;place-items:center}.top{padding:12px 16px}.top h1{font-size:25px}.content{padding:20px 16px 70px}
  .ranges{flex-wrap:nowrap;overflow-x:auto;width:100%;padding-bottom:4px}.ranges button{white-space:nowrap}
}

/* kpi */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:20px}
.kpi{padding:20px 20px 18px;background:var(--graphite);border:1px solid var(--hair);position:relative}
.kpi::before{content:"";position:absolute;left:0;top:0;width:34px;height:2px;background:var(--gold)}
.kpi .l{font:400 10.5px/1.3 var(--body);letter-spacing:.22em;text-transform:uppercase;color:var(--mute)}
.kpi .v{font:500 36px/1.1 var(--display);margin-top:10px;color:var(--ivory)}
.kpi .d{margin-top:8px;font-size:12.5px;color:var(--dim)}
.up{color:var(--green)}.down{color:var(--red)}
.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:16px;margin-bottom:16px}
@media(max-width:480px){.panels{grid-template-columns:minmax(0,1fr)}}
.panel{padding:22px;background:var(--graphite);border:1px solid var(--hair);min-width:0}
.panel h2{font:400 24px/1.1 var(--display);margin-bottom:4px}
.panel .hd{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.panel .hd p{font-size:13px;color:var(--mute)}
.legend{display:flex;gap:16px;font-size:12px;color:var(--mute)}
.legend i{display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:-1px}
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:rgba(242,237,227,.08);stroke-width:1}
.chart .ax{fill:#8f897d;font:11px var(--body)}
.chart .c0{fill:#C9A24B}.chart .c1{fill:#6d6a63}.chart .c2{fill:#7FA8D9}
.chart rect:hover{opacity:.75}
.empty{padding:34px 10px;text-align:center;color:var(--dim)}

/* lists & bars */
.list li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--hair2);cursor:pointer}
.list li:last-child{border:0}.list li:hover .t{color:var(--gold-hi)}
.list .t{font-weight:400}.list .m{font-size:13px;color:var(--mute)}.list .end{margin-left:auto;text-align:right;font-size:13px;color:var(--mute);white-space:nowrap}
.hbar{display:grid;grid-template-columns:150px 1fr auto;gap:12px;align-items:center;padding:7px 0;font-size:14px}
.hbar .tr{height:8px;background:rgba(255,255,255,.06)}.hbar .tr i{display:block;height:100%;background:var(--gold-grad)}
.hbar span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:560px){.hbar{grid-template-columns:100px 1fr auto}}

/* table */
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.bar .grow{flex:1 1 220px;max-width:340px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:none;border:1px solid var(--hair2);padding:8px 12px;font:400 12px/1 var(--body);color:var(--mute)}
.chip.on{border-color:var(--gold);color:var(--gold-hi);background:rgba(201,162,75,.08)}
.chip em{font-style:normal;color:var(--dim);margin-left:6px}
.tw{overflow-x:auto;background:var(--graphite);border:1px solid var(--hair)}
table{width:100%;border-collapse:collapse;min-width:720px}
th{padding:14px 16px;text-align:left;font:400 10.5px/1.2 var(--body);letter-spacing:.2em;text-transform:uppercase;color:var(--gold);border-bottom:1px solid var(--hair);white-space:nowrap}
td{padding:14px 16px;border-bottom:1px solid var(--hair2);vertical-align:top;font-size:14px}
tbody tr{cursor:pointer}tbody tr:hover{background:rgba(201,162,75,.05)}
tbody tr.nohover{cursor:default}tbody tr.nohover:hover{background:none}
tfoot td{font-weight:500;color:var(--gold-hi);border-top:1px solid var(--hair);border-bottom:0}
td b{font-weight:400;color:var(--ivory)}td small{display:block;color:var(--mute);font-size:12.5px}
.pill{display:inline-block;padding:4px 10px;font:500 10px/1.2 var(--body);letter-spacing:.14em;text-transform:uppercase;border:1px solid;white-space:nowrap}
.s-new{color:var(--gold-hi);border-color:var(--gold)}.s-contacted{color:var(--blue);border-color:rgba(127,168,217,.6)}
.s-quoted{color:var(--violet);border-color:rgba(178,154,224,.6)}.s-won,.s-completed{color:var(--green);border-color:rgba(127,191,142,.6)}
.s-lost,.s-cancelled{color:var(--dim);border-color:rgba(124,118,107,.6)}.s-scheduled{color:var(--blue);border-color:rgba(127,168,217,.6)}
.s-in_progress{color:var(--gold-hi);border-color:var(--gold)}.s-admin{color:var(--gold-hi);border-color:var(--gold)}.s-receptionist{color:var(--blue);border-color:rgba(127,168,217,.6)}
.bal-due{color:var(--gold-hi)}.bal-ok{color:var(--green)}

/* calendar */
.calhead{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.calhead h2{font:400 30px/1 var(--display);margin-right:auto}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--hair);border-left:1px solid var(--hair);background:var(--graphite)}
.cal .dow{padding:10px;font:400 10.5px/1 var(--body);letter-spacing:.2em;text-transform:uppercase;color:var(--gold);border-right:1px solid var(--hair);border-bottom:1px solid var(--hair)}
.cal .day{min-height:112px;padding:8px;border-right:1px solid var(--hair);border-bottom:1px solid var(--hair);cursor:pointer;min-width:0}
.cal .day:hover{background:rgba(201,162,75,.05)}
.cal .day.out{opacity:.4}.cal .day.today .n{background:var(--gold);color:var(--black)}.cal .day.sel{outline:1px solid var(--gold);outline-offset:-1px}
.cal .n{display:inline-grid;place-items:center;min-width:24px;height:24px;font-size:12.5px;border-radius:50%}
.ev{display:block;margin-top:4px;padding:3px 6px;font-size:11.5px;line-height:1.3;border-left:2px solid;background:rgba(255,255,255,.05);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev.scheduled{border-color:var(--blue)}.ev.in_progress{border-color:var(--gold)}.ev.completed{border-color:var(--green);opacity:.75}
.more{font-size:11px;color:var(--mute);margin-top:4px}
@media(max-width:700px){.cal .day{min-height:64px;padding:4px}.ev{display:none}.cal .day .dots{display:flex;gap:3px;margin-top:4px;flex-wrap:wrap}.cal .day .dots i{width:6px;height:6px;border-radius:50%;background:var(--gold)}}
@media(min-width:701px){.dots{display:none}}

/* drawer & dialogs */
.veil{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:80;opacity:0;pointer-events:none;transition:.25s}
.veil.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--graphite);border-left:1px solid var(--hair);z-index:90;transform:translateX(100%);transition:transform .28s;display:flex;flex-direction:column}
.drawer.open{transform:none}
.drawer header{padding:22px 26px;border-bottom:1px solid var(--hair);display:flex;align-items:center;justify-content:space-between;gap:12px}
.drawer header h2{font:400 28px/1.1 var(--display)}
.x{background:none;border:1px solid var(--hair);width:38px;height:38px;font-size:20px;line-height:1;padding:0}
.drawer .body{padding:24px 26px;overflow-y:auto;flex:1}
.drawer footer{padding:16px 26px calc(16px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--hair);display:flex;gap:10px;flex-wrap:wrap}
.drawer footer .sp{margin-left:auto}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.sect{font:400 10.5px/1 var(--body);letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin:26px 0 12px;padding-top:20px;border-top:1px solid var(--hair)}
.paylist li{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--hair2);font-size:14px}
.paylist .end{margin-left:auto;display:flex;gap:12px;align-items:center}
.paylist button{background:none;border:0;color:var(--red);font-size:13px;padding:0}
.addpay{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;margin-top:12px;align-items:end}
@media(max-width:560px){.addpay{grid-template-columns:1fr 1fr}}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.sum div{padding:12px;border:1px solid var(--hair2);background:rgba(255,255,255,.02);text-align:center}
.sum small{display:block;font:400 10px/1 var(--body);letter-spacing:.2em;text-transform:uppercase;color:var(--mute);margin-bottom:8px}
.sum b{font:500 22px/1 var(--display)}
.dlg{position:fixed;inset:0;z-index:120;display:grid;place-items:center;background:rgba(0,0,0,.7);padding:20px}
.dlg .card{max-width:420px;width:100%;padding:28px}
.dlg p{margin-bottom:22px}.dlg .row{display:flex;gap:10px;justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);z-index:140;background:var(--graphite);border:1px solid var(--gold);padding:13px 20px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translateX(-50%)}.toast.bad{border-color:var(--red);color:var(--red)}
.note{padding:14px 16px;border:1px solid var(--hair);background:rgba(201,162,75,.06);font-size:13.5px;color:var(--mute);margin-bottom:18px}
.note b{color:var(--gold-hi);font-weight:400}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login" class="center" hidden>
  <form class="card login" id="loginForm" novalidate>
    <div class="logo"><b>LXL</b><small>Admin Dashboard</small></div>
    <h1>Sign in</h1>
    <div class="f"><label for="l-email">Email</label><input id="l-email" type="email" autocomplete="username" required></div>
    <div class="f"><label for="l-pass">Password</label><input id="l-pass" type="password" autocomplete="current-password" required></div>
    <button class="btn gold" id="l-btn" type="submit" style="width:100%">Sign in</button>
    <p class="err" id="l-err" role="alert"></p>
    <button class="linkbtn" type="button" id="l-reset">Forgot password? Email me a reset link</button>
  </form>
</div>

<!-- NO ACCESS -->
<div id="denied" class="center" hidden>
  <div class="card login">
    <div class="logo"><b>LXL</b><small>Admin Dashboard</small></div>
    <h1>No access yet</h1>
    <p class="mute" style="margin-bottom:16px">You are signed in, but this account has not been given staff access. Ask the owner to add you under Staff.</p>
    <p class="dim" style="font-size:12.5px;word-break:break-all;margin-bottom:20px">Owner setting this up for the first time? Create the document <b>staff / <span id="d-uid"></span></b> in Firestore (see the setup steps).</p>
    <button class="btn" id="d-out">Sign out</button>
  </div>
</div>

<!-- APP -->
<div id="app" hidden>
  <aside class="side" id="side">
    <div class="logo"><b>LXL</b><small>Admin</small></div>
    <nav class="nav" id="nav"></nav>
    <div class="me"><b id="me-name"></b><span id="me-role"></span><br><button id="signout">Sign out</button></div>
  </aside>
  <div class="main">
    <header class="top">
      <button class="burger" id="burger" aria-label="Menu"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
      <h1 id="pageTitle"></h1>
      <div id="rangeWrap" style="display:contents">
        <div class="ranges" id="ranges"></div>
        <div class="custom" id="custom" hidden><span class="mute">From</span><input type="date" id="cFrom"><span class="mute">To</span><input type="date" id="cTo"></div>
      </div>
    </header>
    <main class="content"><p class="sub" id="subline"></p><div id="view"></div></main>
  </div>
</div>

<div class="veil" id="veil"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <header><h2 id="dTitle"></h2><button class="x" id="dClose" aria-label="Close">&times;</button></header>
  <div class="body" id="dBody"></div>
  <footer id="dFoot"></footer>
</aside>
<div class="toast" id="toast" role="status"></div>

<script type="module">
import { initializeApp, deleteApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut, sendPasswordResetEmail, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, collection, doc, onSnapshot, addDoc, setDoc, updateDoc, deleteDoc, getDoc, Timestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCkDfCIXCnIiqiME2iM1hleguiKHhOfLG4",
  authDomain: "lxlhome-improvement-llc.firebaseapp.com",
  projectId: "lxlhome-improvement-llc",
  storageBucket: "lxlhome-improvement-llc.firebasestorage.app",
  messagingSenderId: "187111894816",
  appId: "1:187111894816:web:52398864d55c4bf48e7145"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* ---------- constants ---------- */
const QSTAT = { new:"New", contacted:"Contacted", quoted:"Quoted", won:"Won", lost:"Lost" };
const JSTAT = { scheduled:"Scheduled", in_progress:"In progress", completed:"Completed", cancelled:"Cancelled" };
const Q_SERVICES = ["Kitchen renovation","Bathroom repair or refurbishment","Drywall or painting","Siding, roofing or gutters","General repairs or handyman tasks","Something else"];
const J_SERVICES = ["Kitchen renovation","Bathroom repair or refurbishment","Drywall","Interior painting","Siding","Roofing","Gutters","Home repairs","Fixtures & mounting","Other"];
const METHODS = ["Cash","Check","Zelle","Card","Bank transfer","Other"];
const EXP_CATS = ["Materials","Labor / subcontractors","Tools & equipment","Vehicle & fuel","Permits & fees","Marketing","Insurance","Software","Other"];
const RANGES = [["today","Today"],["7d","Last 7 days"],["30d","Last 30 days"],["month","This month"],["lastmonth","Last month"],["3m","3 months"],["6m","6 months"],["12m","12 months"],["ytd","This year"],["all","All time"],["custom","Custom"]];
const ICON = {
  overview:'<path d="M3 12 12 4l9 8M5 10v10h5v-6h4v6h5V10"/>',
  quotes:'<path d="M4 4h16v12H8l-4 4zM8 9h8M8 12h5"/>',
  jobs:'<path d="M3 7h18v13H3zM8 7V4h8v3M3 13h18"/>',
  calendar:'<path d="M4 5h16v15H4zM4 10h16M9 3v4M15 3v4"/>',
  revenue:'<path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/>',
  staff:'<path d="M16 20v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2M9.500 10a3.500 3.500 0 1 0 0-7 3.500 3.500 0 0 0 0 7zM21 20v-2a4 4 0 0 0-3-3.800M16 3.200a3.500 3.500 0 0 1 0 6.600"/>'
};
const PAGES = {
  overview:{title:"Overview",range:true},
  quotes:{title:"Quote requests",range:true},
  jobs:{title:"Jobs",range:true},
  calendar:{title:"Calendar",range:false},
  revenue:{title:"Revenue",range:true,admin:true},
  staff:{title:"Staff",range:false,admin:true}
};

/* ---------- state ---------- */
const S = { user:null, staff:null, isAdmin:false, page:"overview", range:"30d", cFrom:"", cTo:"",
  quotes:[], jobs:[], expenses:[], staffList:[], qStatus:"all", qSearch:"", jStatus:"all", jSearch:"",
  cal:new Date(), calDay:null, drawer:null, draft:null, unsubs:[] };
try { const r = localStorage.getItem("lxl.range"); if (r && RANGES.some(x=>x[0]===r)) S.range = r; } catch(e){}

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const e = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const ymd = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parseYmd = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); };
const sod = d => new Date(d.getFullYear(),d.getMonth(),d.getDate());
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const dayDiff = (a,b) => Math.round((parseYmd(b)-parseYmd(a))/864e5);
const sum = (a,f) => a.reduce((t,x)=>t+(Number(f(x))||0),0);
const money = v => new Intl.NumberFormat("en-US",{style:"currency",currency:"USD",maximumFractionDigits:(Math.abs(v)%1?2:0)}).format(v||0);
const short$ = v => v>=1e6 ? "$"+(v/1e6).toFixed(1)+"M" : v>=1000 ? "$"+(v/1000).toFixed(v%1000?1:0)+"k" : "$"+Math.round(v);
const fmtD = s => s ? parseYmd(s).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}) : "";
const fmtS = d => d.toLocaleDateString("en-US",{month:"short",day:"numeric"});
const num = v => { const n = parseFloat(String(v).replace(/[^0-9.\-]/g,"")); return isFinite(n) ? n : 0; };
const uid = () => Math.random().toString(36).slice(2,10);
const lbl = (map,k) => map[k] || k;
function ago(ts){ const s=(Date.now()-ts)/1000; if(s<60)return"just now"; if(s<3600)return Math.floor(s/60)+" min ago"; if(s<86400)return Math.floor(s/3600)+" hr ago"; const d=Math.floor(s/86400); return d<30?d+(d===1?" day ago":" days ago"):fmtD(ymd(new Date(ts))); }
const pill = (map,k) => `<span class="pill s-${e(k)}">${e(lbl(map,k))}</span>`;
function toast(msg,bad){ const t=$("#toast"); t.textContent=msg; t.className="toast show"+(bad?" bad":""); clearTimeout(toast.t); toast.t=setTimeout(()=>t.className="toast",3600); }
function ask(msg,okLabel="Confirm"){ return new Promise(res=>{ const d=document.createElement("div"); d.className="dlg"; d.innerHTML=`<div class="card" role="alertdialog"><p>${e(msg)}</p><div class="row"><button class="btn" data-n>Cancel</button><button class="btn danger" data-y>${e(okLabel)}</button></div></div>`; d.onclick=ev=>{ if(ev.target.matches("[data-y]")){d.remove();res(true);} else if(ev.target.matches("[data-n]")||ev.target===d){d.remove();res(false);} }; document.body.appendChild(d); }); }
function csv(rows,name){ const safe = v => { v = String(v ?? ""); if(/^[=+\-@\t\r]/.test(v)) v="'"+v; return '"'+v.replace(/"/g,'""')+'"'; }; const blob = new Blob([rows.map(r=>r.map(safe).join(",")).join("\n")],{type:"text/csv"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name+"-"+ymd(new Date())+".csv"; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000); }
const waLink = p => { let d=String(p||"").replace(/\D/g,""); if(d.length===10) d="1"+d; return "https://wa.me/"+d; };

/* ---------- derived data ---------- */
const jobPaid = j => sum(j.payments||[],p=>p.amount);
const jobDone = j => j.completedDate || j.endDate || j.startDate;
const jobBal = j => (Number(j.price)||0) - jobPaid(j);

function earliest(){
  const all=[]; S.quotes.forEach(q=>all.push(q._date)); S.jobs.forEach(j=>{ if(j.startDate)all.push(j.startDate); (j.payments||[]).forEach(p=>p.date&&all.push(p.date)); }); S.expenses.forEach(x=>x.date&&all.push(x.date));
  return all.filter(Boolean).sort()[0] || null;
}
function getRange(){
  const today = sod(new Date()), T = ymd(today), y = today.getFullYear(), m = today.getMonth();
  let f = null, t = T; const r = S.range;
  if(r==="today") f=T;
  else if(r==="7d") f=ymd(addDays(today,-6));
  else if(r==="30d") f=ymd(addDays(today,-29));
  else if(r==="month") f=ymd(new Date(y,m,1));
  else if(r==="lastmonth"){ f=ymd(new Date(y,m-1,1)); t=ymd(new Date(y,m,0)); }
  else if(r==="3m"||r==="6m"||r==="12m"){ const n=parseInt(r,10), x=new Date(today); x.setDate(1); x.setMonth(x.getMonth()-n); const dim=new Date(x.getFullYear(),x.getMonth()+1,0).getDate(); x.setDate(Math.min(today.getDate(),dim)); f=ymd(addDays(x,1)); }
  else if(r==="ytd") f=y+"-01-01";
  else if(r==="custom"){ f=S.cFrom||T; t=S.cTo||T; if(f>t)[f,t]=[t,f]; }
  const cf = f || earliest() || ymd(addDays(today,-364));
  let pf=null, pt=null;
  if(f){ const len=dayDiff(f,t)+1; pt=ymd(addDays(parseYmd(f),-1)); pf=ymd(addDays(parseYmd(pt),-(len-1))); }
  return { f, t, cf, pf, pt, label: f ? (f===t?fmtD(f):fmtD(f)+" – "+fmtD(t)) : "All time" };
}
function calc(f,t){
  const inR = s => !!s && (!f || s>=f) && s<=t;
  const req = S.quotes.filter(q=>inR(q._date));
  const won = req.filter(q=>q.status==="won").length;
  const sched = S.jobs.filter(j=>j.status!=="cancelled" && inR(j.startDate));
  const done = S.jobs.filter(j=>j.status==="completed" && inR(jobDone(j)));
  const pays = []; S.jobs.forEach(j=>(j.payments||[]).forEach(p=>{ if(inR(p.date)) pays.push({...p,job:j}); }));
  const exps = S.expenses.filter(x=>inR(x.date));
  const collected = sum(pays,p=>p.amount), doneValue = sum(done,j=>j.price), expTotal = sum(exps,x=>x.amount);
  return { req, won, sched, done, pays, exps, collected, doneValue, expTotal, net: collected-expTotal };
}
function delta(cur,prev,invert){
  if(prev==null) return "";
  if(!prev) return cur ? `<span class="up">New activity</span> vs previous period` : "No change vs previous period";
  const p = Math.round((cur-prev)/Math.abs(prev)*100), good = invert ? p<=0 : p>=0;
  return `<span class="${p===0?"":good?"up":"down"}">${p>0?"▲":p<0?"▼":"•"} ${Math.abs(p)}%</span> vs previous period`;
}

/* ---------- charts ---------- */
function buckets(f,t){
  const from=parseYmd(f), to=parseYmd(t), days=dayDiff(f,t)+1, out=[];
  if(days<=45){ for(let d=from; d<=to; d=addDays(d,1)) out.push({s:ymd(d),e:ymd(d),label:fmtS(d)}); }
  else if(days<=130){ for(let d=from; d<=to; d=addDays(d,7)){ const en=addDays(d,6); out.push({s:ymd(d),e:ymd(en>to?to:en),label:fmtS(d)}); } }
  else { let c=from; const multi=from.getFullYear()!==to.getFullYear(); while(c<=to){ const eom=new Date(c.getFullYear(),c.getMonth()+1,0); out.push({s:ymd(c),e:ymd(eom>to?to:eom),label:c.toLocaleString("en-US",{month:"short"})+(multi?" "+String(c.getFullYear()).slice(2):"")}); c=new Date(c.getFullYear(),c.getMonth()+1,1); } }
  return out;
}
function niceMax(v){ if(v<=0) return 1; const p=Math.pow(10,Math.floor(Math.log10(v))), n=v/p; return (n<=1?1:n<=2?2:n<=5?5:10)*p; }
function barChart(bk,series,isMoney){
  const W=760,H=270,pl=isMoney?54:34,pr=8,pt=12,pb=30,iw=W-pl-pr,ih=H-pt-pb,n=bk.length;
  const max=niceMax(Math.max(0,...series.flatMap(s=>s.values))), gw=iw/n, bw=Math.max(2,Math.min(34,gw*0.78/series.length));
  let g="";
  for(let i=0;i<=4;i++){ const y=pt+ih-ih*i/4, v=max*i/4; g+=`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}"/><text class="ax" x="${pl-8}" y="${y+4}" text-anchor="end">${isMoney?short$(v):(v%1?v.toFixed(1):v)}</text>`; }
  const step=Math.ceil(n/10);
  bk.forEach((b,i)=>{
    series.forEach((s,j)=>{ const v=s.values[i], h=ih*v/max, x=pl+gw*i+(gw-bw*series.length)/2+bw*j; if(v>0) g+=`<rect class="c${j}" x="${x.toFixed(1)}" y="${(pt+ih-h).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(h,1).toFixed(1)}"><title>${e(b.label)} · ${e(s.name)}: ${isMoney?money(v):v}</title></rect>`; });
    if(i%step===0) g+=`<text class="ax" x="${pl+gw*i+gw/2}" y="${H-9}" text-anchor="middle">${e(b.label)}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Chart">${g}</svg>`;
}
const legend = items => `<div class="legend">${items.map((n,i)=>`<span><i style="background:${["#C9A24B","#6d6a63","#7FA8D9"][i]}"></i>${e(n)}</span>`).join("")}</div>`;
function hbars(rows,isMoney=true){
  if(!rows.length) return `<div class="empty">No data in this period</div>`;
  const max=Math.max(...rows.map(r=>r[1]),1);
  return rows.map(r=>`<div class="hbar"><span title="${e(r[0])}">${e(r[0])}</span><div class="tr"><i style="width:${Math.max(2,r[1]/max*100)}%"></i></div><b style="font-weight:400">${isMoney?money(r[1]):r[1]}</b></div>`).join("");
}
function groupSum(arr,keyFn,valFn){ const m={}; arr.forEach(x=>{ const k=keyFn(x)||"Other"; m[k]=(m[k]||0)+(Number(valFn(x))||0); }); return Object.entries(m).sort((a,b)=>b[1]-a[1]); }

/* ---------- pages ---------- */
function kpi(l,v,d){ return `<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="d">${d||"&nbsp;"}</div></div>`; }

function pageOverview(){
  const R=getRange(), c=calc(R.f,R.t), p=R.f?calc(R.pf,R.pt):null, adm=S.isAdmin, today=ymd(new Date());
  const bk=buckets(R.cf,R.t);
  const reqVals=bk.map(b=>S.quotes.filter(q=>q._date>=b.s&&q._date<=b.e).length);
  const revVals=bk.map(b=>sum(c.pays.filter(x=>x.date>=b.s&&x.date<=b.e),x=>x.amount));
  const conv = c.req.length ? Math.round(c.won/c.req.length*100)+"%" : "–";
  const newQ = S.quotes.filter(q=>q.status==="new").sort((a,b)=>a._ts-b._ts).slice(0,6);
  const upcoming = S.jobs.filter(j=>["scheduled","in_progress"].includes(j.status) && j.startDate<=ymd(addDays(new Date(),14)) && (j.endDate||j.startDate)>=today).sort((a,b)=>a.startDate.localeCompare(b.startDate)).slice(0,6);
  const owed = S.jobs.filter(j=>j.status==="completed" && jobBal(j)>0.005).sort((a,b)=>jobBal(b)-jobBal(a));
  const hr=new Date().getHours(), greet=hr<12?"Good morning":hr<18?"Good afternoon":"Good evening";
  const byService = groupSum(c.done,j=>j.service,j=>j.price).slice(0,6);
  const funnel = Object.keys(QSTAT).map(k=>[QSTAT[k],c.req.filter(q=>q.status===k).length]);
  const aval = c.done.length ? c.doneValue/c.done.length : 0;
  return `
  <div class="kpis">
    ${kpi("New requests",c.req.length,p?delta(c.req.length,p.req.length):"")}
    ${kpi("Quote win rate",conv,`${c.won} won of ${c.req.length}`)}
    ${kpi("Jobs scheduled",c.sched.length,p?delta(c.sched.length,p.sched.length):"")}
    ${kpi("Jobs completed",c.done.length,p?delta(c.done.length,p.done.length):"")}
    ${adm?kpi("Revenue collected",money(c.collected),p?delta(c.collected,p.collected):""):""}
    ${adm?kpi("Completed work value",money(c.doneValue),c.done.length?"Avg "+money(aval)+" per job":""):""}
    ${adm?kpi("Net profit",money(c.net),`After ${money(c.expTotal)} expenses`):""}
    ${adm?kpi("Outstanding balance",money(sum(owed,jobBal)),`${owed.length} completed job${owed.length===1?"":"s"} unpaid`):""}
  </div>
  <div class="panels">
    ${adm?`<div class="panel"><div class="hd"><div><h2>Revenue collected</h2><p>Payments received per ${bk.length&&dayDiff(bk[0].s,bk[0].e)>=27?"month":bk.length&&dayDiff(bk[0].s,bk[0].e)>=6?"week":"day"}</p></div></div>${c.collected||bk.length?barChart(bk,[{name:"Collected",values:revVals}],true):""}</div>`:""}
    <div class="panel"><div class="hd"><div><h2>Quote requests</h2><p>New requests received</p></div></div>${barChart(bk,[{name:"Requests",values:reqVals}],false)}</div>
  </div>
  <div class="panels">
    <div class="panel"><div class="hd"><div><h2>New requests</h2><p>Waiting for a first reply</p></div><button class="btn sm" data-act="goto" data-p="quotes">View all</button></div>
      ${newQ.length?`<ul class="list">${newQ.map(q=>`<li data-act="quote" data-id="${e(q.id)}"><div><div class="t">${e(q.name)}</div><div class="m">${e(q.service)}</div></div><div class="end">${ago(q._ts)}<br>${e(q.phone)}</div></li>`).join("")}</ul>`:`<div class="empty">All caught up. No new requests.</div>`}</div>
    <div class="panel"><div class="hd"><div><h2>Upcoming jobs</h2><p>Next 14 days and in progress</p></div><button class="btn sm" data-act="goto" data-p="calendar">Calendar</button></div>
      ${upcoming.length?`<ul class="list">${upcoming.map(j=>`<li data-act="job" data-id="${e(j.id)}"><div><div class="t">${e(j.title)}</div><div class="m">${e(j.clientName)}${j.address?" · "+e(j.address):""}</div></div><div class="end">${fmtD(j.startDate)}<br>${pill(JSTAT,j.status)}</div></li>`).join("")}</ul>`:`<div class="empty">Nothing scheduled in the next two weeks.</div>`}</div>
  </div>
  <div class="panels">
    <div class="panel"><div class="hd"><div><h2>Quote pipeline</h2><p>Status of requests received in this period</p></div></div>${hbars(funnel,false)}</div>
    ${adm?`<div class="panel"><div class="hd"><div><h2>Awaiting payment</h2><p>Completed jobs with a balance</p></div></div>
      ${owed.length?`<ul class="list">${owed.slice(0,6).map(j=>`<li data-act="job" data-id="${e(j.id)}"><div><div class="t">${e(j.clientName)}</div><div class="m">${e(j.title)}</div></div><div class="end bal-due"><b style="font-weight:500;font-size:15px">${money(jobBal(j))}</b></div></li>`).join("")}</ul>`:`<div class="empty">No unpaid balances.</div>`}</div>
    <div class="panel"><div class="hd"><div><h2>Work by service</h2><p>Completed work value</p></div></div>${hbars(byService)}</div>`:""}
  </div>
  <p class="dim" style="font-size:13px">${greet}, ${e(S.staff.name||S.user.email)}.</p>`;
}

function pageQuotes(){
  const R=getRange(), inR=s=>(!R.f||s>=R.f)&&s<=R.t;
  const inRange=S.quotes.filter(q=>inR(q._date));
  const term=S.qSearch.trim().toLowerCase();
  const list=inRange.filter(q=>(S.qStatus==="all"||q.status===S.qStatus)&&(!term||[q.name,q.phone,q.email,q.service,q.details].join(" ").toLowerCase().includes(term))).sort((a,b)=>b._ts-a._ts);
  const cnt=k=>k==="all"?inRange.length:inRange.filter(q=>q.status===k).length;
  return `
  <div class="bar">
    <input id="qSearch" class="grow" type="search" placeholder="Search name, phone, service..." value="${e(S.qSearch)}" data-in="qSearch">
    <div class="chips">${["all",...Object.keys(QSTAT)].map(k=>`<button class="chip ${S.qStatus===k?"on":""}" data-act="qfilter" data-k="${k}">${k==="all"?"All":QSTAT[k]}<em>${cnt(k)}</em></button>`).join("")}</div>
    <span style="margin-left:auto;display:flex;gap:8px"><button class="btn sm" data-act="export-quotes">Export CSV</button><button class="btn sm gold" data-act="new-quote">+ Add request</button></span>
  </div>

  ${list.map(q=>`<tr data-act="quote" data-id="${e(q.id)}"><td class="nw">${fmtD(q._date)}<small>${ago(q._ts)}</small></td><td><b>${e(q.name)}</b><small>${e(q.phone)}${q.email?" · "+e(q.email):""}</small></td><td>${e(q.service)}</td><td class="mute" style="max-width:280px">${e((q.details||"").slice(0,90))}${(q.details||"").length>90?"…":""}</td><td>${pill(QSTAT,q.status)}${q.followUp&&["new","contacted","quoted"].includes(q.status)?`<small>Follow up ${fmtD(q.followUp)}</small>`:""}</td><td class="r nw">${q.quotedAmount?money(q.quotedAmount):'<span class="dim">–</span>'}</td></tr>`).join("")||`<tr class="nohover"><td colspan="6"><div class="empty">No requests match this view.</div></td></tr>`}
  </tbody></table></div>`;
}

function pageJobs(){
  const R=getRange(), inR=s=>!!s&&(!R.f||s>=R.f)&&s<=R.t;

    <div class="chips">${["all",...Object.keys(JSTAT)].map(k=>`<button class="chip ${S.jStatus===k?"on":""}" data-act="jfilter" data-k="${k}">${k==="all"?"All":JSTAT[k]}<em>${cnt(k)}</em></button>`).join("")}</div>
    <span style="margin-left:auto;display:flex;gap:8px"><button class="btn sm" data-act="export-jobs">Export CSV</button><button class="btn sm gold" data-act="new-job">+ Add job</button></span>

  </tbody>${live.length?`<tfoot><tr><td colspan="4">Total (${live.length} job${live.length===1?"":"s"}, excl. cancelled)</td><td class="r">${money(sum(live,j=>j.price))}</td><td class="r">${money(sum(live,jobPaid))}</td><td class="r">${money(sum(live,jobBal))}</td></tr></tfoot>`:""}</table></div>`;

function pageCalendar(){
  const y=S.cal.getFullYear(), m=S.cal.getMonth(), first=new Date(y,m,1), start=addDays(first,-first.getDay()), T=ymd(new Date());
  const jobs=S.jobs.filter(j=>j.status!=="cancelled"&&j.startDate);
  const onDay=s=>jobs.filter(j=>j.startDate<=s&&(j.endDate||j.startDate)>=s);
  let cells="";
  for(let i=0;i<42;i++){
    const d=addDays(start,i), s=ymd(d), js=onDay(s);
    cells+=`<div class="day ${d.getMonth()!==m?"out":""} ${s===T?"today":""} ${s===S.calDay?"sel":""}" data-act="calday" data-d="${s}"><span class="n">${d.getDate()}</span>${js.slice(0,3).map(j=>`<span class="ev ${e(j.status)}" data-act="job" data-id="${e(j.id)}" title="${e(j.title)}">${e(j.clientName||j.title)}</span>`).join("")}${js.length>3?`<div class="more">+${js.length-3} more</div>`:""}${js.length?`<div class="dots">${js.slice(0,4).map(()=>"<i></i>").join("")}</div>`:""}</div>`;
  }
  const sel=S.calDay?onDay(S.calDay):[];
  return `
  <div class="calhead"><h2>${S.cal.toLocaleString("en-US",{month:"long",year:"numeric"})}</h2>

}

function pageRevenue(){
  const R=getRange(), c=calc(R.f,R.t), p=R.f?calc(R.pf,R.pt):null;
  const bk=buckets(R.cf,R.t);
  const rev=bk.map(b=>sum(c.pays.filter(x=>x.date>=b.s&&x.date<=b.e),x=>x.amount));
  const exp=bk.map(b=>sum(c.exps.filter(x=>x.date>=b.s&&x.date<=b.e),x=>x.amount));
  const owed=S.jobs.filter(j=>j.status==="completed"&&jobBal(j)>0.005);
  const booked=sum(S.jobs.filter(j=>j.status==="scheduled"||j.status==="in_progress"),j=>j.price);
  const bySvc=groupSum(c.done,j=>j.service,j=>j.price);
  const byMethod=groupSum(c.pays,x=>x.method,x=>x.amount);
  const byClient=groupSum(c.done,j=>j.clientName,j=>j.price).slice(0,8);
  const byCat=groupSum(c.exps,x=>x.category,x=>x.amount);
  const margin=c.collected?Math.round(c.net/c.collected*100)+"% margin":"";
  const pays=[...c.pays].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,40);
  const exps=[...c.exps].sort((a,b)=>b.date.localeCompare(a.date));
  return `
  <div class="kpis">
    ${kpi("Revenue collected",money(c.collected),p?delta(c.collected,p.collected):"")}
    ${kpi("Completed work value",money(c.doneValue),`${c.done.length} job${c.done.length===1?"":"s"}${c.done.length?" · avg "+money(c.doneValue/c.done.length):""}`)}
    ${kpi("Expenses",money(c.expTotal),p?delta(c.expTotal,p.expTotal,true):"")}
    ${kpi("Net profit",money(c.net),margin)}
    ${kpi("Outstanding",money(sum(owed,jobBal)),`${owed.length} completed job${owed.length===1?"":"s"} unpaid`)}
    ${kpi("Booked pipeline",money(booked),"Scheduled and in-progress jobs")}
  </div>
  <div class="panel" style="margin-bottom:16px"><div class="hd"><div><h2>Collected vs expenses</h2><p>${e(R.label)}</p></div>${legend(["Collected","Expenses"])}</div>${barChart(bk,[{name:"Collected",values:rev},{name:"Expenses",values:exp}],true)}</div>
  <div class="panels">
    <div class="panel"><div class="hd"><div><h2>Work by service</h2><p>Completed work value</p></div></div>${hbars(bySvc)}</div>
    <div class="panel"><div class="hd"><div><h2>Top clients</h2><p>By completed work value</p></div></div>${hbars(byClient)}</div>
    <div class="panel"><div class="hd"><div><h2>Payment methods</h2><p>Money collected</p></div></div>${hbars(byMethod)}</div>
    <div class="panel"><div class="hd"><div><h2>Expenses by category</h2><p>Money spent</p></div></div>${hbars(byCat)}</div>
  </div>
  <div class="panel" style="margin-bottom:16px"><div class="hd"><div><h2>Payments received</h2><p>Most recent ${pays.length} in this period</p></div><button class="btn sm" data-act="export-pays">Export CSV</button></div>
    <div class="tw" style="border:0"><table><thead><tr><th>Date</th><th>Client</th><th>Job</th><th>Method</th><th class="r">Amount</th></tr></thead><tbody>
    ${pays.map(x=>`<tr data-act="job" data-id="${e(x.job.id)}"><td class="nw">${fmtD(x.date)}</td><td>${e(x.job.clientName)}</td><td>${e(x.job.title)}</td><td>${e(x.method||"")}</td><td class="r nw">${money(x.amount)}</td></tr>`).join("")||`<tr class="nohover"><td colspan="5"><div class="empty">No payments in this period.</div></td></tr>`}</tbody></table></div></div>
  <div class="panel"><div class="hd"><div><h2>Expenses</h2><p>Materials, labor and running costs</p></div><span style="display:flex;gap:8px"><button class="btn sm" data-act="export-exps">Export CSV</button><button class="btn sm gold" data-act="new-expense">+ Add expense</button></span></div>
    <div class="tw" style="border:0"><table><thead><tr><th>Date</th><th>Category</th><th>Note</th><th class="r">Amount</th></tr></thead><tbody>
    ${exps.map(x=>`<tr data-act="expense" data-id="${e(x.id)}"><td class="nw">${fmtD(x.date)}</td><td>${e(x.category)}</td><td class="mute">${e(x.note||"")}</td><td class="r nw">${money(x.amount)}</td></tr>`).join("")||`<tr class="nohover"><td colspan="4"><div class="empty">No expenses logged in this period.</div></td></tr>`}</tbody></table></div></div>`;
}

function pageStaff(){

/* ---------- render ---------- */
function render(){
  if(!S.staff) return;
  const pg = PAGES[S.page];
  const a = document.activeElement, aid = a && a.id, pos = a && a.selectionStart, sy = window.scrollY;
  const R = getRange();
  const fn = { overview:pageOverview, quotes:pageQuotes, jobs:pageJobs, calendar:pageCalendar, revenue:pageRevenue, staff:pageStaff }[S.page];
  $("#view").innerHTML = fn();
  $("#pageTitle").textContent = pg.title;
  $("#rangeWrap").hidden = !pg.range;
  $("#subline").textContent = pg.range ? "Showing "+R.label : "";
  $("#subline").hidden = !pg.range;
  $("#ranges").innerHTML = RANGES.map(r=>`<button class="${S.range===r[0]?"on":""}" data-range="${r[0]}">${r[1]}</button>`).join("");
  $("#custom").hidden = !(pg.range && S.range==="custom");
  $("#cFrom").value = S.cFrom; $("#cTo").value = S.cTo;
  const newCount = S.quotes.filter(q=>q.status==="new").length;
  $("#nav").innerHTML = Object.entries(PAGES).filter(([k,v])=>!v.admin||S.isAdmin).map(([k,v])=>`<button data-page="${k}" class="${S.page===k?"on":""}"><svg viewBox="0 0 24 24">${ICON[k==="overview"?"overview":k]}</svg>${v.title}${k==="quotes"&&newCount?`<span class="badge">${newCount}</span>`:""}</button>`).join("");
  document.title = (newCount?`(${newCount}) `:"")+"LXL Admin";
  if(aid){ const el=document.getElementById(aid); if(el){ el.focus(); try{ el.setSelectionRange(pos,pos); }catch(x){} } }
  window.scrollTo(0,sy);
}
function go(p){ if(PAGES[p].admin&&!S.isAdmin) p="overview"; S.page=p; $("#side").classList.remove("open"); render(); window.scrollTo(0,0); }

/* ---------- drawer ---------- */
function openDrawer(title,body,foot){ $("#dTitle").textContent=title; $("#dBody").innerHTML=body; $("#dFoot").innerHTML=foot; $("#drawer").classList.add("open"); $("#veil").classList.add("open"); $("#drawer").setAttribute("aria-hidden","false"); $("#dBody").scrollTop=0; }
function closeDrawer(){ $("#drawer").classList.remove("open"); $("#veil").classList.remove("open"); $("#drawer").setAttribute("aria-hidden","true"); S.drawer=null; S.draft=null; }
const val = id => { const el=document.getElementById(id); return el ? el.value.trim() : ""; };
const opts = (list,cur) => { const l = list.includes(cur)||!cur ? list : [...list,cur]; return l.map(o=>`<option ${o===cur?"selected":""}>${e(o)}</option>`).join(""); };
const kopts = (map,cur) => Object.entries(map).map(([k,v])=>`<option value="${k}" ${k===cur?"selected":""}>${v}</option>`).join("");
async function guard(btn,fn){ btn&&(btn.disabled=true); try{ await fn(); }catch(err){ console.error(err); toast(err.code==="permission-denied"?"Not allowed for your role.":"Something went wrong: "+(err.message||err),true); } finally{ btn&&(btn.disabled=false); } }

function refreshJob(){
  const d=S.draft; if(!d) return;
  $("#payList").innerHTML = d.payments.length ? d.payments.map(p=>`<li><span>${fmtD(p.date)}</span><span class="mute">${e(p.method||"")}</span><span class="end"><b style="font-weight:500">${money(p.amount)}</b><button type="button" data-act="del-pay" data-id="${e(p.id)}">Remove</button></span></li>`).join("") : `<li class="dim">No payments recorded yet.</li>`;

  $("#jobSum").innerHTML = `<div><small>Price</small><b>${money(price)}</b></div><div><small>Paid</small><b>${money(paid)}</b></div><div><small>Balance</small><b class="${bal>0.005?"bal-due":"bal-ok"}">${money(bal)}</b></div>`;
}

/* ---------- actions ---------- */
const A = {
  goto: t => go(t.dataset.p),
  quote: t => openQuote(t.dataset.id),
  job: t => openJob(t.dataset.id),
  expense: t => openExpense(t.dataset.id),
  staff: t => openStaff(t.dataset.id),
  "new-quote": () => newQuoteDrawer(),
  "new-job": t => openJob(null, t.dataset.date ? {startDate:t.dataset.date} : null),
  "new-expense": () => openExpense(null),
  "new-staff": () => openStaff(null),
  qfilter: t => { S.qStatus=t.dataset.k; render(); },
  jfilter: t => { S.jStatus=t.dataset.k; render(); },
  calprev: () => { S.cal=new Date(S.cal.getFullYear(),S.cal.getMonth()-1,1); render(); },
  calnext: () => { S.cal=new Date(S.cal.getFullYear(),S.cal.getMonth()+1,1); render(); },
  caltoday: () => { S.cal=new Date(); S.calDay=ymd(new Date()); render(); },
  calday: t => { S.calDay=t.dataset.d; render(); },

  "create-quote": t => guard(t, async()=>{
    const d={name:val("dq-name"),phone:val("dq-phone"),email:val("dq-email"),service:val("dq-service"),details:val("dq-details")};
    if(!d.name||!d.phone){ toast("Name and phone are required.",true); return; }
    await addDoc(collection(db,"quoteRequests"),{...d,source:"manual",status:"new",createdAt:Timestamp.now(),createdBy:S.user.email});
    closeDrawer(); toast("Request added.");
  }),
  "save-quote": t => guard(t, async()=>{
    const id=S.drawer.id, d={name:val("dq-name"),phone:val("dq-phone"),email:val("dq-email"),service:val("dq-service"),details:val("dq-details"),status:val("dq-status"),quotedAmount:num(val("dq-amount"))||null,followUp:val("dq-follow"),notes:val("dq-notes"),updatedAt:Timestamp.now(),updatedBy:S.user.email};
    if(!d.name){ toast("Name is required.",true); return; }
    await updateDoc(doc(db,"quoteRequests",id),d); closeDrawer(); toast("Saved.");
  }),
  "quote-to-job": () => {
    const q=S.quotes.find(x=>x.id===S.drawer.id); if(!q) return;
    const map={"Drywall or painting":"Drywall","Siding, roofing or gutters":"Siding","General repairs or handyman tasks":"Home repairs","Something else":"Other"};
    const pre={title:q.service,clientName:val("dq-name")||q.name,phone:val("dq-phone")||q.phone,email:val("dq-email")||q.email,service:map[q.service]||q.service,price:num(val("dq-amount"))||q.quotedAmount||0,notes:val("dq-details")||q.details,quoteId:q.id};
    closeDrawer(); openJob(null,pre);
  },
  "del-quote": async t => { if(await ask("Delete this quote request permanently?","Delete")) guard(t, async()=>{ await deleteDoc(doc(db,"quoteRequests",S.drawer.id)); closeDrawer(); toast("Deleted."); }); },

  "add-pay": () => {
    const amt=num(val("np-amt")); if(amt<=0){ toast("Enter a payment amount.",true); return; }
    S.draft.payments.push({id:uid(),amount:amt,date:val("np-date")||ymd(new Date()),method:val("np-m")}); $("#np-amt").value=""; refreshJob();
  },
  "del-pay": t => { S.draft.payments=S.draft.payments.filter(p=>p.id!==t.dataset.id); refreshJob(); },
  "save-job": t => guard(t, async()=>{
    const status=val("dj-status"), start=val("dj-start"), end=val("dj-end");
    const d={title:val("dj-title"),clientName:val("dj-client"),phone:val("dj-phone"),email:val("dj-email"),address:val("dj-addr"),service:val("dj-service"),status,startDate:start,endDate:end,price:num(val("dj-price")),crew:val("dj-crew"),notes:val("dj-notes"),payments:S.draft.payments,updatedAt:Timestamp.now(),updatedBy:S.user.email};
    d.completedDate = status==="completed" ? (val("dj-comp")||ymd(new Date())) : "";
    if(!d.title||!d.clientName||!start){ toast("Title, client and start date are required.",true); return; }
    if(end&&end<start){ toast("End date is before the start date.",true); return; }
    const id=S.drawer.id;
    if(id) await updateDoc(doc(db,"jobs",id),d);
    else {
      if(S.draft.quoteId) d.quoteId=S.draft.quoteId;
      d.createdAt=Timestamp.now(); d.createdBy=S.user.email;
      const ref=await addDoc(collection(db,"jobs"),d);
      if(d.quoteId) await updateDoc(doc(db,"quoteRequests",d.quoteId),{status:"won",jobId:ref.id,updatedAt:Timestamp.now()});
    }
    closeDrawer(); toast("Job saved.");
  }),
  "del-job": async t => { if(await ask("Delete this job and its payment records permanently?","Delete")) guard(t, async()=>{ await deleteDoc(doc(db,"jobs",S.drawer.id)); closeDrawer(); toast("Deleted."); }); },

  "save-expense": t => guard(t, async()=>{
    const d={date:val("de-date"),amount:num(val("de-amt")),category:val("de-cat"),note:val("de-note")};
    if(!d.date||d.amount<=0){ toast("Date and amount are required.",true); return; }
    if(S.drawer.id) await updateDoc(doc(db,"expenses",S.drawer.id),d); else await addDoc(collection(db,"expenses"),{...d,createdAt:Timestamp.now(),createdBy:S.user.email});
    closeDrawer(); toast("Expense saved.");
  }),
  "del-expense": async t => { if(await ask("Delete this expense?","Delete")) guard(t, async()=>{ await deleteDoc(doc(db,"expenses",S.drawer.id)); closeDrawer(); toast("Deleted."); }); },

  "save-staff": t => guard(t, async()=>{
    const id=S.drawer.id, name=val("ds-name"), role=val("ds-role"), active=val("ds-active")!=="0";
    if(!name){ toast("Name is required.",true); return; }
    if(id){ const self=id===S.user.uid; await updateDoc(doc(db,"staff",id), self?{name}:{name,role,active}); closeDrawer(); toast("Saved."); return; }
    const email=val("ds-email"), pw=val("ds-pass");
    if(!email||pw.length<6){ toast("Email and a password of 6+ characters are required.",true); return; }
    const sec=initializeApp(firebaseConfig,"sec"+Date.now());
    try{
      const cred=await createUserWithEmailAndPassword(getAuth(sec),email,pw);
      await signOut(getAuth(sec));
      await setDoc(doc(db,"staff",cred.user.uid),{name,email,role,active,createdAt:Timestamp.now()});
    } finally { deleteApp(sec); }
    closeDrawer(); toast("Account created. Share the temporary password with them.");
  }),
  "reset-staff": t => guard(t, async()=>{ const s=S.staffList.find(x=>x.id===S.drawer.id); await sendPasswordResetEmail(auth,s.email); toast("Reset email sent to "+s.email); }),
  "del-staff": async t => { if(await ask("Remove this person's access? Their login stays in Firebase Authentication but it will no longer open the dashboard.","Remove")) guard(t, async()=>{ await deleteDoc(doc(db,"staff",S.drawer.id)); closeDrawer(); toast("Access removed."); }); },

  "export-quotes": () => { const R=getRange(); csv([["Received","Name","Phone","Email","Service","Status","Quoted","Details","Notes"],...S.quotes.filter(q=>(!R.f||q._date>=R.f)&&q._date<=R.t).map(q=>[q._date,q.name,q.phone,q.email,q.service,q.status,q.quotedAmount||"",q.details,q.notes||""])],"quote-requests"); },
  "export-jobs": () => { const R=getRange(); csv([["Start","End","Title","Client","Phone","Address","Service","Status","Price","Paid","Balance"],...S.jobs.filter(j=>(!R.f||j.startDate>=R.f)&&j.startDate<=R.t).map(j=>[j.startDate,j.endDate||"",j.title,j.clientName,j.phone,j.address||"",j.service,j.status,j.price||0,jobPaid(j),jobBal(j)])],"jobs"); },
  "export-pays": () => { const R=getRange(), c=calc(R.f,R.t); csv([["Date","Client","Job","Method","Amount"],...c.pays.map(x=>[x.date,x.job.clientName,x.job.title,x.method||"",x.amount])],"payments"); },
  "export-exps": () => { const R=getRange(), c=calc(R.f,R.t); csv([["Date","Category","Note","Amount"],...c.exps.map(x=>[x.date,x.category,x.note||"",x.amount])],"expenses"); }
};

/* ---------- events ---------- */
document.addEventListener("click", ev => {
  const rb = ev.target.closest("[data-range]");
  if(rb){ S.range=rb.dataset.range; try{ localStorage.setItem("lxl.range",S.range); }catch(x){} render(); return; }
  const nb = ev.target.closest("[data-page]"); if(nb){ go(nb.dataset.page); return; }
  const t = ev.target.closest("[data-act]");
  if(t && A[t.dataset.act]){ ev.stopPropagation(); A[t.dataset.act](t); }
});
document.addEventListener("input", ev => {
  const t=ev.target;
  if(t.dataset && t.dataset.in){ S[t.dataset.in]=t.value; render(); }
  if(t.id==="dj-price") refreshJob();
});
document.addEventListener("change", ev => {
  const t=ev.target;
  if(t.id==="cFrom"){ S.cFrom=t.value; render(); }
  if(t.id==="cTo"){ S.cTo=t.value; render(); }
  if(t.id==="dj-status") $("#dj-compwrap").hidden = t.value!=="completed";
});
$("#dClose").onclick = closeDrawer; $("#veil").onclick = closeDrawer;
document.addEventListener("keydown", ev => { if(ev.key==="Escape") closeDrawer(); });
$("#burger").onclick = () => $("#side").classList.toggle("open");
$("#signout").onclick = () => signOut(auth);
$("#d-out").onclick = () => signOut(auth);

/* ---------- auth ---------- */
const show = id => ["login","denied","app"].forEach(x=>$("#"+x).hidden = x!==id);
$("#loginForm").addEventListener("submit", async ev => {
  ev.preventDefault(); const b=$("#l-btn"), er=$("#l-err"); er.textContent="";
  const email=$("#l-email").value.trim(), pw=$("#l-pass").value;
  if(!email||!pw){ er.textContent="Enter your email and password."; return; }
  b.disabled=true;
  try{ await signInWithEmailAndPassword(auth,email,pw); }
  catch(err){ er.textContent = ["auth/invalid-credential","auth/wrong-password","auth/user-not-found","auth/invalid-email"].includes(err.code) ? "Email or password is incorrect." : err.code==="auth/too-many-requests" ? "Too many attempts. Wait a few minutes and try again." : "Could not sign in. Check your connection."; }
  b.disabled=false;
});
$("#l-reset").onclick = async () => {
  const er=$("#l-err"), email=$("#l-email").value.trim(); er.style.color="";
  if(!email){ er.textContent="Type your email above first."; return; }
  try{ await sendPasswordResetEmail(auth,email); er.style.color="var(--gold-hi)"; er.textContent="If that account exists, a reset link is on its way."; }
  catch(err){ er.textContent="Could not send the reset email."; }
};

function stopListeners(){ S.unsubs.forEach(u=>u()); S.unsubs=[]; S.quotes=[];S.jobs=[];S.expenses=[];S.staffList=[]; }
function listen(name,key,map){
  S.unsubs.push(onSnapshot(collection(db,name), snap => { S[key]=snap.docs.map(d=>map(d.id,d.data())); render(); }, err => { console.error(name,err); toast("Cannot load "+name+": "+(err.code==="permission-denied"?"permission denied (check Firestore rules).":err.message),true); }));
}
const tsOf = v => v && v.toDate ? v.toDate().getTime() : (v ? new Date(v).getTime() : Date.now());
onAuthStateChanged(auth, async user => {
  stopListeners(); S.user=user; S.staff=null; S.isAdmin=false; closeDrawer();
  if(!user){ show("login"); return; }
  let snap;
  try{ snap = await getDoc(doc(db,"staff",user.uid)); }catch(err){ snap=null; }
  if(!snap || !snap.exists() || snap.data().active===false){ $("#d-uid").textContent=user.uid; show("denied"); return; }
  S.staff=snap.data(); S.isAdmin=S.staff.role==="admin";
  $("#me-name").textContent=S.staff.name||user.email; $("#me-role").textContent=S.isAdmin?"Admin":"Receptionist";
  show("app");
  listen("quoteRequests","quotes",(id,d)=>{ const ts=tsOf(d.createdAt); return {id,...d,name:d.name||"",phone:d.phone||"",email:d.email||"",service:d.service||"",details:d.details||"",status:QSTAT[d.status]?d.status:"new",_ts:ts,_date:ymd(new Date(ts))}; });
  listen("jobs","jobs",(id,d)=>({id,...d,title:d.title||"",clientName:d.clientName||"",service:d.service||"Other",status:JSTAT[d.status]?d.status:"scheduled",startDate:d.startDate||"",price:Number(d.price)||0,payments:Array.isArray(d.payments)?d.payments:[]}));
  if(S.isAdmin){ listen("expenses","expenses",(id,d)=>({id,...d,amount:Number(d.amount)||0,date:d.date||""})); listen("staff","staffList",(id,d)=>({id,...d})); }
  if(!PAGES[S.page]||(PAGES[S.page].admin&&!S.isAdmin)) S.page="overview";
  S.calDay=ymd(new Date());
  render();
});
</script>
</body>
